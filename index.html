l protocolo PAS, la manera correcta de comunicar una emergencia al 112, las funciones básicas de la persona socorrista y las condiciones esenciales del botiquín del centro de trabajo."]},{"t":"p","x":["En el sector nàutic, una actuació precipitada pot posar en perill tant la persona accidentada com qui intenta ajudar-la. Per això, la primera prioritat és garantir la seguretat de l’escenari abans d’intervenir.","En el sector náutico, una actuación precipitada puede poner en peligro tanto a la persona accidentada como a quien intenta ayudarla. Por eso, la primera prioridad es garantizar la seguridad del escenario antes de intervenir."]},{"t":"p","x":["Objectius d’aprenentatge","Objetivos de aprendizaje"]},{"t":"list","k":"ul","l":1,"items":[["Definir els primers auxilis i identificar-ne els límits.","Definir los primeros auxilios e identificar sus límites."],["Aplicar ordenadament el protocol PAS: protegir, avisar i socórrer.","Aplicar ordenadamente el protocolo PAS: proteger, avisar y socorrer."],["Identificar la informació necessària per comunicar una emergència al 112.","Identificar la información necesaria para comunicar una emergencia al 112."],["Reconèixer els elements bàsics de la farmaciola i la importància de mantenir-la en condicions adequades.","Reconocer los elementos básicos del botiquín y la importancia de mantenerlo en condiciones adecuadas."],["Relacionar les actuacions inicials amb els riscos habituals d’un taller, un varador, un pantalà o una embarcació.","Relacionar las actuaciones iniciales con los riesgos habituales de un taller, un varadero, un pantalán o una embarcación."]],"start":1,"smart":"goals"}],"acts":[],"videos":[]},{"num":2,"kind":"theory","title":["Conceptes essencials","Conceptos esenciales"],"nodes":[{"t":"p","x":["Primers auxilis. Conjunt d’actuacions immediates i provisionals que es duen a terme davant d’un accident o una indisposició, amb els mitjans disponibles i fins que arriba l’assistència sanitària adequada.","Primeros auxilios. Conjunto de actuaciones inmediatas y provisionales que se llevan a cabo ante un accidente o una indisposición, con los medios disponibles y hasta que llega la asistencia sanitaria adecuada."]},{"t":"p","x":["Protocol PAS. Seqüència general d’actuació davant d’una emergència:","Protocolo PAS. Secuencia general de actuación ante una emergencia:"]},{"t":"viz","v":{"type":"chain","title":["Protocol PAS","Protocolo PAS"],"items":[{"i":"shield","s":"must","x":["P — Protegir: assegurar l’escenari i evitar nous accidents.","P — Proteger: asegurar el escenario y evitar nuevos accidentes."]},{"i":"phone","s":"safe","x":["A — Avisar: comunicar l’emergència al 112 i activar, si escau, el protocol intern.","A — Avisar: comunicar la emergencia al 112 y activar, si procede, el protocolo interno."]},{"i":"kit","s":"safe","x":["S — Socórrer: prestar l’ajuda inicial adequada sense agreujar les lesions.","S — Socorrer: prestar la ayuda inicial adecuada sin agravar las lesiones."]}]}},{"t":"p","x":["Cadena de supervivència. Conjunt d’actuacions successives que poden augmentar les possibilitats de supervivència davant d’una aturada cardiorespiratòria: reconeixement precoç, petició d’ajuda, reanimació cardiopulmonar (RCP), desfibril·lació precoç i assistència sanitària posterior.","Cadena de supervivencia. Conjunto de actuaciones sucesivas que pueden aumentar las posibilidades de supervivencia ante una parada cardiorrespiratoria: reconocimiento precoz, petición de ayuda, reanimación cardiopulmonar (RCP), desfibrilación precoz y asistencia sanitaria posterior."]},{"t":"p","x":["Farmaciola de primers auxilis. Recurs que conté material bàsic per a les primeres cures. Ha d’estar accessible, identificat, revisat i reposat quan s’utilitza material o aquest deixa de ser adequat.","Botiquín de primeros auxilios. Recurso que contiene material básico para las primeras curas. Debe estar accesible, identificado, revisado y repuesto cuando se utiliza material o este deja de ser adecuado."]},{"t":"p","x":["Persona socorrista no sanitària. Persona que presta l’ajuda inicial dins dels límits de la seva formació i dels recursos disponibles. No substitueix els professionals sanitaris.","Persona socorrista no sanitaria. Persona que presta la ayuda inicial dentro de los límites de su formación y de los recursos disponibles. No sustituye a los profesionales sanitarios."]},{"t":"sub","x":["3. Explicació dels conceptes","3. Explicación de los conceptos"]},{"t":"sub","x":["3.1. PER QUÈ CAL RESPECTAR L’ORDRE DEL PROTOCOL PAS?","3.1. ¿POR QUÉ HAY QUE RESPETAR EL ORDEN DEL PROTOCOLO PAS?"]},{"t":"p","x":["La primera actuació no és tocar la víctima, sinó comprovar si l’entorn és segur.","La primera actuación no es tocar a la víctima, sino comprobar si el entorno es seguro."]},{"t":"p","x":["En un taller nàutic, per exemple, una persona pot patir una descàrrega elèctrica mentre manipula un equip connectat a la xarxa. Si un company s’hi acosta sense eliminar el perill elèctric, també pot resultar ferit.","En un taller náutico, por ejemplo, una persona puede sufrir una descarga eléctrica mientras manipula un equipo conectado a la red. Si un compañero se acerca sin eliminar el peligro eléctrico, también puede resultar herido."]},{"t":"p","x":["Per tant, abans d’intervenir, cal identificar els perills immediats: electricitat, maquinària en moviment, fum, foc, vapors químics, risc de caiguda o atmosferes perilloses.","Por tanto, antes de intervenir, hay que identificar los peligros inmediatos: electricidad, maquinaria en movimiento, humo, fuego, vapores químicos, riesgo de caída o atmósferas peligrosas."]},{"t":"box","k":"important","label":null,"nodes":[{"t":"p","x":["Important: no s’ha d’entrar en espais confinats ni en atmosferes potencialment tòxiques sense la formació, els equips i el procediment de rescat corresponents.","Importante: no se debe entrar en espacios confinados ni en atmósferas potencialmente tóxicas sin la formación, los equipos y el procedimiento de rescate correspondientes."]}]},{"t":"sub","x":["3.2. COM AVISAR CORRECTAMENT EL 112","3.2. CÓMO AVISAR CORRECTAMENTE AL 112"]},{"t":"p","x":["Quan es comunica una emergència, cal transmetre informació clara i concreta:","Cuando se comunica una emergencia, hay que transmitir información clara y concreta:"]},{"t":"viz","v":{"type":"cards","title":["Què cal dir quan truques al 112","Qué hay que decir cuando llamas al 112"],"items":[{"i":"flag","s":"safe","x":["Localització: adreça, pantalà, moll, taller o punt d’accés exacte.","Localización: dirección, pantalán, muelle, taller o punto de acceso exacto."]},{"i":"alert","s":"safe","x":["Tipus d’incident: electrocució, caiguda, hemorràgia, incendi o intoxicació, entre d’altres.","Tipo de incidente: electrocución, caída, hemorragia, incendio o intoxicación, entre otros."]},{"i":"group","s":"safe","x":["Nombre de persones afectades.","Número de personas afectadas."]},{"i":"heart","s":"safe","x":["Estat aparent de la víctima: consciència i respiració, si s’ha pogut comprovar amb seguretat.","Estado aparente de la víctima: consciencia y respiración, si se ha podido comprobar con seguridad."]},{"i":"warn","s":"safe","x":["Riscos presents: electricitat, productes químics, combustible, foc o dificultats d’accés.","Riesgos presentes: electricidad, productos químicos, combustible, fuego o dificultades de acceso."]},{"i":"phone","s":"safe","x":["Telèfon de contacte i qualsevol indicació útil per facilitar l’arribada dels equips d’emergència.","Teléfono de contacto y cualquier indicación útil para facilitar la llegada de los equipos de emergencia."]}]}},{"t":"p","x":["Cal seguir les instruccions de l’operador i no finalitzar la comunicació fins que ho indiqui, llevat que hi hagi una situació que impedeixi continuar.","Hay que seguir las instrucciones del operador y no finalizar la comunicación hasta que lo indique, salvo que haya una situación que impida continuar."]},{"t":"sub","x":["3.3. FARMACIOLA: ÚS I MANTENIMENT","3.3. BOTIQUÍN: USO Y MANTENIMIENTO"]},{"t":"p","x":["La farmaciola ha de disposar del material de primers auxilis adequat als riscos i a les necessitats del centre de treball. El material habitual pot incloure gases estèrils, apòsits, benes, esparadrap, tisores, pinces i guants d’un sol ús, segons la dotació aplicable.","El botiquín debe disponer del material de primeros auxilios adecuado a los riesgos y a las necesidades del centro de trabajo. El material habitual puede incluir gasas estériles, apósitos, vendas, esparadrapo, tijeras, pinzas y guantes de un solo uso, según la dotación aplicable."]},{"t":"p","x":["Cal comprovar periòdicament:","Hay que comprobar periódicamente:"]},{"t":"viz","v":{"type":"cards","title":["Farmaciola: què cal comprovar","Botiquín: qué hay que comprobar"],"items":[{"i":"sign","s":"safe","x":["Que la farmaciola estigui senyalitzada i accessible.","Que el botiquín esté señalizado y accesible."]},{"i":"check","s":"safe","x":["Que el material estigui en bon estat i dins del termini d’ús.","Que el material esté en buen estado y dentro del plazo de uso."]},{"i":"cycle","s":"safe","x":["Que els elements utilitzats es reposin.","Que los elementos utilizados se repongan."]},{"i":"target","s":"safe","x":["Que el contingut sigui adequat als riscos del taller o de l’activitat.","Que el contenido sea adecuado a los riesgos del taller o de la actividad."]},{"i":"kit","s":"safe","x":["Que s’hi inclogui només el material que correspongui i no s’hi incorporin medicaments per a l’administració indiscriminada per part de personal no sanitari.","Que se incluya solo el material que corresponda y no se incorporen medicamentos para la administración indiscriminada por parte de personal no sanitario."]}]}},{"t":"p","x":["La dotació exigible s’ha de contrastar amb la normativa vigent i amb l’avaluació de riscos del centre.","La dotación exigible se debe contrastar con la normativa vigente y con la evaluación de riesgos del centro."]}],"acts":[],"videos":[],"visuals":[{"type":"key","i":"hand","s":"ban","big":["Primer, un escenari segur","Primero, un escenario seguro"],"x":["La primera actuació no és tocar la víctima, sinó comprovar si l’entorn és segur.","La primera actuación no es tocar a la víctima, sino comprobar si el entorno es seguro."],"src":["Per tant, abans d’intervenir, cal identificar els perills immediats: electricitat, maquinària en moviment, fum, foc, vapors químics, risc de caiguda o atmosferes perilloses.","Por tanto, antes de intervenir, hay que identificar los peligros inmediatos: electricidad, maquinaria en movimiento, humo, fuego, vapores químicos, riesgo de caída o atmósferas peligrosas."]}]},{"num":4,"kind":"theory","title":["Analogia per recordar el protocol PAS","Analogía para recordar el protocolo PAS"],"nodes":[{"t":"p","x":["El PAS és com preparar una màquina abans de reparar-la.","El PAS es como preparar una máquina antes de repararla."]},{"t":"p","x":["Abans d’intervenir-hi, es desconnecta i s’assegura que no pugui causar danys. Després, es demana suport quan és necessari i, finalment, es realitza la intervenció adequada.","Antes de intervenir en ella, se desconecta y se asegura que no pueda causar daños. Después, se pide apoyo cuando es necesario y, finalmente, se realiza la intervención adecuada."]},{"t":"p","x":["De la mateixa manera, davant d’un accident, primer es protegeix l’escenari, després s’avisa i finalment s’ajuda la víctima.","De la misma manera, ante un accidente, primero se protege el escenario, después se avisa y finalmente se ayuda a la víctima."]}],"acts":[],"videos":[],"visuals":[{"type":"chain","items":[{"i":"lock","s":"must","x":["Desconnectar i assegurar","Desconectar y asegurar"]},{"i":"phone","s":"safe","x":["Demanar suport","Pedir apoyo"]},{"i":"wrench","s":"safe","x":["Intervenir","Intervenir"]}]}]},{"num":5,"kind":"example","title":["Exemples professionals del sector nàutic","Ejemplos profesionales del sector náutico"],"nodes":[{"t":"sub","x":["CAS 1. ACCIDENT ELÈCTRIC AL PANTALÀ","CASO 1. ACCIDENTE ELÉCTRICO EN EL PANTALÁN"]},{"t":"p","x":["Un tècnic queda a terra després d’una descàrrega elèctrica.","Un técnico queda en el suelo después de una descarga eléctrica."]},{"t":"list","k":"ul","l":1,"items":[["Protegir: no tocar la víctima mentre pugui continuar en contacte amb la font elèctrica. Tallar el subministrament només si es pot fer amb seguretat.","Proteger: no tocar a la víctima mientras pueda continuar en contacto con la fuente eléctrica. Cortar el suministro solo si se puede hacer con seguridad."],["Avisar: activar el 112 i comunicar la localització i la sospita d’electrocució.","Avisar: activar el 112 y comunicar la localización y la sospecha de electrocución."],["Socórrer: una vegada eliminat el perill, seguir les instruccions del 112 i comprovar la resposta i la respiració segons la formació rebuda. Si no respira amb normalitat, cal iniciar les maniobres de reanimació indicades i utilitzar un DEA si està disponible.","Socorrer: una vez eliminado el peligro, seguir las instrucciones del 112 y comprobar la respuesta y la respiración según la formación recibida. Si no respira con normalidad, hay que iniciar las maniobras de reanimación indicadas y utilizar un DEA si está disponible."]],"start":1},{"t":"sub","x":["CAS 2. TALL PROFUND AL TALLER","CASO 2. CORTE PROFUNDO EN EL TALLER"]},{"t":"p","x":["Un treballador es fa un tall important amb una eina de tall.","Un trabajador se hace un corte importante con una herramienta de corte."]},{"t":"list","k":"ul","l":1,"items":[["Comprovar que la màquina estigui aturada i que la zona sigui segura.","Comprobar que la máquina esté parada y que la zona sea segura."],["Posar-se guants de protecció si n’hi ha de disponibles.","Ponerse guantes de protección si hay disponibles."],["Aplicar pressió directa sobre la ferida amb material adequat.","Aplicar presión directa sobre la herida con material adecuado."],["Demanar assistència sanitària urgent si l’hemorràgia és abundant o no es controla.","Pedir asistencia sanitaria urgente si la hemorragia es abundante o no se controla."],["No administrar medicaments ni manipular profundament la ferida.","No administrar medicamentos ni manipular profundamente la herida."]],"start":1},{"t":"sub","x":["CAS 3. POSSIBLE INTOXICACIÓ EN UNA SENTINA","CASO 3. POSIBLE INTOXICACIÓN EN UNA SENTINA"]},{"t":"p","x":["Un treballador queda inconscient dins d’un compartiment amb possibles vapors de dissolvents.","Un trabajador queda inconsciente dentro de un compartimento con posibles vapores de disolventes."]},{"t":"p","x":["No s’ha d’entrar a rescatar-lo sense els mitjans i la formació necessaris. Cal avisar immediatament els serveis d’emergència, indicar que es tracta d’un possible espai confinat i seguir el procediment de rescat establert.","No se debe entrar a rescatarlo sin los medios y la formación necesarios. Hay que avisar inmediatamente a los servicios de emergencia, indicar que se trata de un posible espacio confinado y seguir el procedimiento de rescate establecido."]}],"acts":[],"videos":[],"visuals":[{"type":"scene","scene":"firstaid","spots":[{"px":96,"py":160,"t":["P — Protegir: assegurar l’escenari i evitar nous accidents.","P — Proteger: asegurar el escenario y evitar nuevos accidentes."]},{"px":238,"py":98,"t":["A — Avisar: comunicar l’emergència al 112 i activar, si escau, el protocol intern.","A — Avisar: comunicar la emergencia al 112 y activar, si procede, el protocolo interno."]},{"px":338,"py":150,"t":["S — Socórrer: prestar l’ajuda inicial adequada sense agreujar les lesions.","S — Socorrer: prestar la ayuda inicial adecuada sin agravar las lesiones."]}],"title":["Accident elèctric al pantalà: aplica el PAS","Accidente eléctrico en el pantalán: aplica el PAS"]},{"type":"cards","items":[{"i":"bolt","s":"warn","x":["CAS 1. ACCIDENT ELÈCTRIC AL PANTALÀ","CASO 1. ACCIDENTE ELÉCTRICO EN EL PANTALÁN"],"d":["Un tècnic queda a terra després d’una descàrrega elèctrica.","Un técnico queda en el suelo después de una descarga eléctrica."]},{"i":"bandage","s":"warn","x":["CAS 2. TALL PROFUND AL TALLER","CASO 2. CORTE PROFUNDO EN EL TALLER"],"d":["Un treballador es fa un tall important amb una eina de tall.","Un trabajador se hace un corte importante con una herramienta de corte."]},{"i":"anchor","s":"warn","x":["CAS 3. POSSIBLE INTOXICACIÓ EN UNA SENTINA","CASO 3. POSIBLE INTOXICACIÓN EN UNA SENTINA"],"d":["Un treballador queda inconscient dins d’un compartiment amb possibles vapors de dissolvents.","Un trabajador queda inconsciente dentro de un compartimento con posibles vapores de disolventes."]}]}]},{"num":6,"kind":"theory","title":["Normativa de referència","Normativa de referencia"],"nodes":[{"t":"list","k":"ul","l":1,"items":[["Llei 31/1995, de prevenció de riscos laborals (LPRL), article 20: mesures d’emergència, primers auxilis i organització de la resposta.","Ley 31/1995, de prevención de riesgos laborales (LPRL), artículo 20: medidas de emergencia, primeros auxilios y organización de la respuesta."],["Reial decret 486/1997, de 14 d’abril, sobre disposicions mínimes de seguretat i salut als llocs de treball, annex VI: material i locals de primers auxilis.","Real Decreto 486/1997, de 14 de abril, sobre disposiciones mínimas de seguridad y salud en los lugares de trabajo, anexo VI: material y locales de primeros auxilios."],["Reial decret 393/2007: norma bàsica d’autoprotecció, en els supòsits en què sigui aplicable.","Real Decreto 393/2007: norma básica de autoprotección, en los supuestos en que sea aplicable."]],"start":1},{"t":"p","x":["La concreció dels requisits de farmaciola, locals de primers auxilis i organització de l’emergència s’ha de verificar segons la normativa vigent, les característiques del centre i la seva avaluació de riscos.","La concreción de los requisitos de botiquín, locales de primeros auxilios y organización de la emergencia se debe verificar según la normativa vigente, las características del centro y su evaluación de riesgos."]}],"acts":[],"videos":[]},{"num":7,"kind":"activity","title":["Activitats d’aprenentatge","Actividades de aprendizaje"],"nodes":[{"t":"p","x":["ACTIVITAT 1. EL PROTOCOL PAS EN TRES EMERGÈNCIES","ACTIVIDAD 1. EL PROTOCOLO PAS EN TRES EMERGENCIAS"]},{"t":"p","x":["En grups, prepareu una seqüència d’actuació per a cadascun dels casos següents:","En grupos, preparad una secuencia de actuación para cada uno de los casos siguientes:"]},{"t":"list","k":"ol","l":1,"items":[["Descàrrega elèctrica en un pantalà.","Descarga eléctrica en un pantalán."],["Tall profund en un taller de mecanitzat.","Corte profundo en un taller de mecanizado."],["Possible intoxicació per vapors en un compartiment d’una embarcació.","Posible intoxicación por vapores en un compartimento de una embarcación."]],"start":1},{"t":"p","x":["Per a cada cas, indiqueu què cal fer en les fases de protegir, avisar i socórrer, i quines actuacions s’han d’evitar.","Para cada caso, indicad qué hay que hacer en las fases de proteger, avisar y socorrer, y qué actuaciones se deben evitar."]},{"t":"p","x":["ACTIVITAT 2. REVISIÓ DE LA FARMACIOLA","ACTIVIDAD 2. REVISIÓN DEL BOTIQUÍN"]},{"t":"p","x":["Amb una llista de comprovació facilitada pel docent, reviseu una farmaciola real o simulada. Identifiqueu el material disponible, l’estat de conservació, els elements que cal reposar i les possibles deficiències.","Con una lista de comprobación facilitada por el docente, revisad un botiquín real o simulado. Identificad el material disponible, el estado de conservación, los elementos que hay que reponer y las posibles deficiencias."]},{"t":"p","x":["No retireu ni manipuleu material real sense autorització del docent o de la persona responsable.","No retiréis ni manipuléis material real sin autorización del docente o de la persona responsable."]},{"t":"p","x":["ACTIVITAT 3. SIMULACIÓ D’UNA TRUCADA AL 112","ACTIVIDAD 3. SIMULACIÓN DE UNA LLAMADA AL 112"]},{"t":"p","x":["En parelles, una persona comunica una emergència i l’altra representa l’operador. La comunicació ha d’incloure la localització, el tipus d’incident, el nombre d’afectats, l’estat aparent de la víctima i els riscos de l’escenari.","En parejas, una persona comunica una emergencia y la otra representa al operador. La comunicación debe incluir la localización, el tipo de incidente, el número de afectados, el estado aparente de la víctima y los riesgos del escenario."]}],"acts":["B29-a1","B29-a2","B29-a3"],"videos":[]},{"num":8,"kind":"theory","title":["Evidències d’aprenentatge","Evidencias de aprendizaje"],"nodes":[{"t":"list","k":"ul","l":1,"items":[["Cartell o infografia del protocol PAS adaptat a un taller nàutic.","Cartel o infografía del protocolo PAS adaptado a un taller náutico."],["Llista de comprovació de la farmaciola.","Lista de comprobación del botiquín."],["Fitxa de resolució d’un cas pràctic.","Ficha de resolución de un caso práctico."],["Simulació oral d’una comunicació d’emergència.","Simulación oral de una comunicación de emergencia."]],"start":1}],"acts":[],"videos":[]},{"num":9,"kind":"assessment","title":["Avaluació dels resultats d’aprenentatge i les competències","Evaluación de los resultados de aprendizaje y las competencias"],"nodes":[{"t":"p","x":["Resultat d’aprenentatge dels certificats professionals: RA4, relacionat amb l’anàlisi de situacions de risc i l’aplicació de tècniques bàsiques de primers auxilis.","Resultado de aprendizaje de los certificados profesionales: RA4, relacionado con el análisis de situaciones de riesgo y la aplicación de técnicas básicas de primeros auxilios."]},{"t":"p","x":["Criteris d’avaluació: identificació de la seqüència PAS, selecció de les actuacions inicials adequades, comunicació eficaç de l’emergència i reconeixement dels límits de l’actuació no sanitària.","Criterios de evaluación: identificación de la secuencia PAS, selección de las actuaciones iniciales adecuadas, comunicación eficaz de la emergencia y reconocimiento de los límites de la actuación no sanitaria."]},{"t":"p","x":["Competència per a l’ocupabilitat observable: actuació responsable davant d’una emergència, comunicació clara i col·laboració amb altres persones.","Competencia para la empleabilidad observable: actuación responsable ante una emergencia, comunicación clara y colaboración con otras personas."]},{"t":"p","x":["Instrument: rúbrica d’observació de la simulació, complementada amb la revisió de la fitxa pràctica.","Instrumento: rúbrica de observación de la simulación, complementada con la revisión de la ficha práctica."]},{"t":"p","x":["En el mòdul de FP, aquest bloc contribueix al RA2 de prevenció de riscos laborals i a la competència d’ocupabilitat ñ), relativa a l’aplicació de protocols i mesures preventives durant el procés productiu.","En el módulo de FP, este bloque contribuye al RA2 de prevención de riesgos laborales y a la competencia de empleabilidad ñ), relativa a la aplicación de protocolos y medidas preventivas durante el proceso productivo."]}],"acts":[],"videos":[]},{"num":10,"kind":"selfcheck","title":["Autoavaluació","Autoevaluación"],"nodes":[],"acts":["B29-autoav"],"videos":[],"replaced":true},{"num":11,"kind":"summary","title":["Resum visual","Resumen visual"],"nodes":[{"t":"sub","x":["PROTOCOL PAS","PROTOCOLO PAS"]},{"t":"p","x":["P — PROTEGIR: assegurar l’escenari i eliminar els perills només si es pot fer amb seguretat.","P — PROTEGER: asegurar el escenario y eliminar los peligros solo si se puede hacer con seguridad."]},{"t":"p","x":["A — AVISAR: trucar al 112, facilitar informació clara i seguir les instruccions.","A — AVISAR: llamar al 112, facilitar información clara y seguir las instrucciones."]},{"t":"p","x":["S — SOCÓRRER: ajudar la víctima dins dels límits de la formació i sense agreujar les lesions.","S — SOCORRER: ayudar a la víctima dentro de los límites de la formación y sin agravar las lesiones."]},{"t":"box","k":"idea","label":null,"nodes":[{"t":"p","x":["Recorda: la primera obligació és evitar que l’accident afecti més persones.","Recuerda: la primera obligación es evitar que el accidente afecte a más personas."]}]}],"acts":[],"videos":[]},{"num":12,"kind":"summary","title":["Què has de saber fer en acabar el bloc?","¿Qué tienes que saber hacer al acabar el bloque?"],"nodes":[{"t":"p","x":["Has de poder interpretar una situació d’emergència en un taller, varador, pantalà o embarcació; establir les prioritats d’actuació; comunicar correctament la situació; i identificar els recursos de primers auxilis disponibles.","Tienes que poder interpretar una situación de emergencia en un taller, varadero, pantalán o embarcación; establecer las prioridades de actuación; comunicar correctamente la situación; e identificar los recursos de primeros auxilios disponibles."]},{"t":"p","x":["Les maniobres pràctiques s’han d’aprendre i practicar amb supervisió qualificada, d’acord amb els protocols actualitzats de primers auxilis.","Las maniobras prácticas se deben aprender y practicar con supervisión cualificada, de acuerdo con los protocolos actualizados de primeros auxilios."]}],"acts":[],"videos":[]}],"final":["B29-pas","B29-112","B29-test"],"acts":[{"id":"B29-a1","type":"teacher","origin":"manual","title":["Activitat 1 — El protocol PAS en tres emergències (en grup)","Actividad 1 — El protocolo PAS en tres emergencias (en grupo)"],"grid":{"cols":[["Cas","Caso"],["Protegir","Proteger"],["Avisar","Avisar"],["Socórrer","Socorrer"],["Actuacions que cal evitar","Actuaciones que se deben evitar"]],"rows":3},"instr":["Casos: descàrrega elèctrica en un pantalà; tall profund en un taller de mecanització; possible intoxicació per vapors en un compartiment.","Casos: descarga eléctrica en un pantalán; corte profundo en un taller de mecanizado; posible intoxicación por vapores en un compartimento."],"block":"B29","ra":"RA2 (competència ñ)","ce":"segons la planificació: i (principal), d (complementari)"},{"id":"B29-a2","type":"class","origin":"manual","title":["Activitat 2 — Revisió de la farmaciola","Actividad 2 — Revisión del botiquín"],"instr":["Amb la llista de comprovació del docent. No retireu ni manipuleu material real sense autorització.","Con la lista de comprobación del docente. No retiréis ni manipuléis material real sin autorización."],"block":"B29","ra":"RA2 (competència ñ)","ce":"segons la planificació: i (principal), d (complementari)"},{"id":"B29-a3","type":"class","origin":"manual","title":["Activitat 3 — Simulació d'una trucada al 112 (en parelles)","Actividad 3 — Simulación de una llamada al 112 (en parejas)"],"instr":["Simulació oral: localització, tipus d'incident, nombre d'afectats, estat aparent de la víctima i riscos de l'escenari. No es truca realment al 112.","Simulación oral: localización, tipo de incidente, número de afectados, estado aparente de la víctima y riesgos del escenario. No se llama realmente al 112."],"block":"B29","ra":"RA2 (competència ñ)","ce":"segons la planificació: i (principal), d (complementari)"},{"id":"B29-autoav","block":"B29","type":"teacher","origin":"manual","title":["Autoavaluació","Autoevaluación"],"instr":["El manual planteja aquestes preguntes obertes sense solucionari: respon-les i el docent les revisarà.","El manual plantea estas preguntas abiertas sin solucionario: respóndelas y el docente las revisará."],"fields":[["Explico què són els primers auxilis i quins són els seus límits.","Explico qué son los primeros auxilios y cuáles son sus límites."],["Recordo i aplico l’ordre protegir, avisar i socórrer.","Recuerdo y aplico el orden proteger, avisar y socorrer."],["Identifico la informació que cal comunicar al 112.","Identifico la información que hay que comunicar al 112."],["Reconec la importància de revisar i reposar la farmaciola.","Reconozco la importancia de revisar y reponer el botiquín."],["Identifico situacions en què intentar rescatar una víctima sense protecció pot generar un segon accident.","Identifico situaciones en las que intentar rescatar a una víctima sin protección puede generar un segundo accidente."]],"ra":"RA2 (competè  comprobar si responde"],["No tocar-lo mentre pugui estar en contacte amb la font elèctrica","No tocarlo mientras pueda estar en contacto con la fuente eléctrica"],["Donar-li aigua","Darle agua"]],"ans":1},{"q":["Un company queda inconscient dins d'una sentina amb vapors de dissolvent. Què cal fer?","Un compañero queda inconsciente dentro de una sentina con vapores de disolvente. ¿Qué hay que hacer?"],"opts":[["Entrar ràpidament a treure'l","Entrar rápidamente a sacarlo"],["Avisar els serveis d'emergència, indicar possible espai confinat i seguir el procediment de rescat","Avisar a los servicios de emergencia, indicar posible espacio confinado y seguir el procedimiento de rescate"],["Esperar que es recuperi sol","Esperar a que se recupere solo"]],"ans":1},{"q":["Davant un tall profund, què indica el manual?","Ante un corte profundo, ¿qué indica el manual?"],"opts":[["Aplicar pressió directa sobre la ferida amb material adequat","Aplicar presión directa sobre la herida con material adecuado"],["Administrar un analgèsic","Administrar un analgésico"],["Netejar a fons l'interior de la ferida","Limpiar a fondo el interior de la herida"]],"ans":0},{"q":["La farmaciola ha d'incloure medicaments per administrar lliurement per personal no sanitari?","¿El botiquín debe incluir medicamentos para administrar libremente por personal no sanitario?"],"opts":[["Sí","Sí"],["No","No"]],"ans":1}],"block":"B29","origin":"complementaria","ra":"RA2 (competència ñ)","ce":"segons la planificació: i (principal), d (complementari)"}],"notes":[],"cover":{"signs":[["must","shield",["Protegir","Proteger"]],["safe","phone",["Avisar al 112","Avisar al 112"]],["safe","kit",["Socórrer","Socorrer"]]],"lead":["Recorda: la primera obligació és evitar que l’accident afecti més persones.","Recuerda: la primera obligación es evitar que el accidente afecte a más personas."]}},{"id":"B30","ud":"UD5","title":["TÈCNIQUES ESPECÍFIQUES DE PRIMERS AUXILIS","TÉCNICAS ESPECÍFICAS DE PRIMEROS AUXILIOS"],"meta":{"ra_fp":"RA2 (competència ñ)","ce_txt":"segons la planificació: i (principal)","ra_cert":"RA4","pes":"0,625 % (planificació)"},"sections":[{"num":0,"kind":"intro","title":null,"nodes":[{"t":"p","x":["Part V. Primers auxilis Cicle formatiu: Grau mitjà de Manteniment d’Embarcacions de Recreo (TMV26)","Parte V. Primeros auxilios Ciclo formativo: Grado medio de Mantenimiento de Embarcaciones de Recreo (TMV26)"]}],"acts":[],"videos":[]},{"num":1,"kind":"objectives","title":["Què aprendrem?","¿Qué aprenderemos?"],"nodes":[{"t":"p","x":["En aquest bloc aprofundirem en les tècniques bàsiques d’actuació davant de diferents lesions o emergències que poden produir-se en un taller, un varador, un pantalà o una embarcació.","En este bloque profundizaremos en las técnicas básicas de actuación ante diferentes lesiones o emergencias que pueden producirse en un taller, un varadero, un pantalán o una embarcación."]},{"t":"p","x":["Aprendràs a distingir situacions que requereixen reanimació cardiopulmonar (RCP), posició lateral de seguretat (PLS), actuació davant d’un ennuegament, control d’hemorràgies, atenció inicial de cremades i protecció davant de traumatismes o convulsions.","Aprenderás a distinguir situaciones que requieren reanimación cardiopulmonar (RCP), posición lateral de seguridad (PLS), actuación ante un atragantamiento, control de hemorragias, atención inicial de quemaduras y protección ante traumatismos o convulsiones."]},{"t":"p","x":["Aquest bloc complementa el B29: el protocol PAS estableix l’ordre general d’actuació; aquest bloc desenvolupa les actuacions bàsiques de la fase Socórrer.","Este bloque complementa el B29: el protocolo PAS establece el orden general de actuación; este bloque desarrolla las actuaciones básicas de la fase Socorrer."]},{"t":"p","x":["Objectius d’aprenentatge","Objetivos de aprendizaje"]},{"t":"list","k":"ul","l":1,"items":[["Reconèixer una possible aturada cardiorespiratòria i activar la resposta d’emergència.","Reconocer una posible parada cardiorrespiratoria y activar la respuesta de emergencia."],["Diferenciar quan cal aplicar RCP i quan es pot utilitzar la PLS.","Diferenciar cuándo hay que aplicar RCP y cuándo se puede utilizar la PLS."],["Identificar les actuacions bàsiques davant d’una obstrucció de la via aèria.","Identificar las actuaciones básicas ante una obstrucción de la vía aérea."],["Aplicar mesures inicials de control d’hemorràgies i protecció de ferides.","Aplicar medidas iniciales de control de hemorragias y protección de heridas."],["Identificar les primeres mesures davant de cremades i traumatismes.","Identificar las primeras medidas ante quemaduras y traumatismos."],["Reconèixer les actuacions segures davant d’una crisi convulsiva.","Reconocer las actuaciones seguras ante una crisis convulsiva."]],"start":1,"smart":"goals"}],"acts":[],"videos":[]},{"num":2,"kind":"theory","title":["Conceptes essencials","Conceptos esenciales"],"nodes":[{"t":"p","x":["Suport vital bàsic (SVB). Conjunt d’actuacions inicials per mantenir les funcions vitals d’una persona en una emergència fins que arribi l’ajuda especialitzada.","Soporte vital básico (SVB). Conjunto de actuaciones iniciales para mantener las funciones vitales de una persona en una emergencia hasta que llegue la ayuda especializada."]},{"t":"p","x":["Reanimació cardiopulmonar (RCP). Maniobres destinades a mantenir una circulació sanguínia mínima quan una persona està en aturada cardiorespiratòria.","Reanimación cardiopulmonar (RCP). Maniobras destinadas a mantener una circulación sanguínea mínima cuando una persona está en parada cardiorrespiratoria."]},{"t":"p","x":["Desfibril·lador extern automatitzat (DEA). Dispositiu que analitza el ritme cardíac i indica si cal administrar una descàrrega. Cal seguir-ne les instruccions i les indicacions de l’operador del 112.","Desfibrilador externo automatizado (DEA). Dispositivo que analiza el ritmo cardíaco e indica si hay que administrar una descarga. Hay que seguir sus instrucciones y las indicaciones del operador del 112."]},{"t":"p","x":["Posició lateral de seguretat (PLS). Posició utilitzada habitualment per a una persona inconscient que respira amb normalitat, sempre que no hi hagi circumstàncies que requereixin un altre procediment, com ara un traumatisme greu que faci necessari limitar els moviments.","Posición lateral de seguridad (PLS). Posición utilizada habitualmente para una persona inconsciente que respira con normalidad, siempre que no haya circunstancias que requieran otro procedimiento, como un traumatismo grave que haga necesario limitar los movimientos."]},{"t":"p","x":["Obstrucció de la via aèria. Bloqueig parcial o complet del pas de l’aire, per exemple, a causa d’un cos estrany.","Obstrucción de la vía aérea. Bloqueo parcial o completo del paso del aire, por ejemplo, a causa de un cuerpo extraño."]},{"t":"p","x":["Hemorràgia externa. Pèrdua de sang a través d’una ferida. Pot ser greu si és abundant o no es controla.","Hemorragia externa. Pérdida de sangre a través de una herida. Puede ser grave si es abundante o no se controla."]},{"t":"p","x":["Cremada. Lesió dels teixits produïda per calor, electricitat, radiació o agents químics.","Quemadura. Lesión de los tejidos producida por calor, electricidad, radiación o agentes químicos."]},{"t":"p","x":["Traumatisme. Lesió causada per un cop, una caiguda, una compressió o un altre mecanisme físic.","Traumatismo. Lesión causada por un golpe, una caída, una compresión u otro mecanismo físico."]}],"acts":[],"videos":[],"visuals":[{"type":"cards","items":[{"i":"heart","s":"safe","x":["SVB","SVB"],"d":["Suport vital bàsic","Soporte vital básico"]},{"i":"pulse","s":"safe","x":["RCP","RCP"],"d":["Reanimació cardiopulmonar","Reanimación cardiopulmonar"]},{"i":"bolt","s":"safe","x":["DEA","DEA"],"d":["Desfibril·lador extern automatitzat","Desfibrilador externo automatizado"]},{"i":"user","s":"safe","x":["PLS","PLS"],"d":["Posició lateral de seguretat","Posición lateral de seguridad"]},{"i":"lungs","s":"warn","x":["Obstrucció de la via aèria","Obstrucción de la vía aérea"]},{"i":"drop","s":"warn","x":["Hemorràgia externa","Hemorragia externa"]},{"i":"burn","s":"warn","x":["Cremada","Quemadura"]},{"i":"bone","s":"warn","x":["Traumatisme","Traumatismo"]}],"cols":4}],"fold":true},{"num":3,"kind":"theory","title":["Explicació de les tècniques","Explicación de las técnicas"],"nodes":[{"t":"sub","x":["3.1. ATURADA CARDIORESPIRATÒRIA: RCP I DEA","3.1. PARADA CARDIORRESPIRATORIA: RCP Y DEA"]},{"t":"p","x":["Davant d’una persona inconscient, cal valorar la resposta i comprovar si respira amb normalitat, seguint la formació rebuda i les instruccions del 112.","Ante una persona inconsciente, hay que valorar la respuesta y comprobar si respira con normalidad, siguiendo la formación recibida y las instrucciones del 112."]},{"t":"p","x":["Si la persona no respon i no respira amb normalitat, s’ha de considerar una possible aturada cardiorespiratòria:","Si la persona no responde y no respira con normalidad, se debe considerar una posible parada cardiorrespiratoria:"]},{"t":"viz","v":{"type":"steps","title":["Possible aturada cardiorespiratòria","Posible parada cardiorrespiratoria"],"items":[{"x":["Assegurar que l’escenari sigui segur.","Asegurar que el escenario sea seguro."],"i":"shield","s":"must"},{"x":["Demanar ajuda i activar el 112.","Pedir ayuda y activar el 112."],"i":"phone","s":"safe"},{"x":["Iniciar la RCP segons les indicacions de l’operador i la formació rebuda.","Iniciar la RCP según las indicaciones del operador y la formación recibida."],"i":"heart","s":"safe"},{"x":["Utilitzar un DEA tan aviat com estigui disponible i seguir-ne les instruccions.","Utilizar un DEA tan pronto como esté disponible y seguir sus instrucciones."],"i":"bolt","s":"safe"},{"x":["Continuar fins que la víctima mostri signes de recuperació, arribi l’ajuda professional o sigui necessari aturar-se per motius de seguretat.","Continuar hasta que la víctima muestre signos de recuperación, llegue la ayuda profesional o sea necesario detenerse por motivos de seguridad."],"i":"clock","s":"safe"}]}},{"t":"p","x":["En adults, la seqüència habitual de RCP per a persones formades és de 30 compressions toràciques i 2 ventilacions, amb una freqüència de 100–120 compressions per minut. Si no es poden fer ventilacions, cal seguir les indicacions de l’operador i les recomanacions de primers auxilis aplicables.","En adultos, la secuencia habitual de RCP para personas formadas es de 30 compresiones torácicas y 2 ventilaciones, con una frecuencia de 100–120 compresiones por minuto. Si no se pueden hacer ventilaciones, hay que seguir las indicaciones del operador y las recomendaciones de primeros auxilios aplicables."]},{"t":"sub","x":["3.2. PERSONA INCONSCIENT QUE RESPIRA: PLS","3.2. PERSONA INCONSCIENTE QUE RESPIRA: PLS"]},{"t":"p","x":["Quan una persona està inconscient però respira amb normalitat, cal mantenir la via aèria oberta i vigilar contínuament la respiració.","Cuando una persona está inconsciente pero respira con normalidad, hay que mantener la vía aérea abierta y vigilar continuamente la respiración."]},{"t":"p","x":["La PLS pot ajudar a mantenir la via aèria lliure i facilitar el drenatge de fluids. Tanmateix, si se sospita una lesió greu de columna o un traumatisme important, cal evitar moviments innecessaris i seguir les instruccions dels serveis d’emergència. La seguretat de la via aèria continua sent prioritària.","La PLS puede ayudar a mantener la vía aérea libre y facilitar el drenaje de fluidos. Sin embargo, si se sospecha una lesión grave de columna o un traumatismo importante, hay que evitar movimientos innecesarios y seguir las instrucciones de los servicios de emergencia. La seguridad de la vía aérea continúa siendo prioritaria."]},{"t":"p","x":["Si la respiració deixa de ser normal, cal actuar davant d’una possible aturada cardiorespiratòria.","Si la respiración deja de ser normal, hay que actuar ante una posible parada cardiorrespiratoria."]},{"t":"sub","x":["3.3. ENNUEGAMENT O OBSTRUCCIÓ DE LA VIA AÈRIA","3.3. ATRAGANTAMIENTO U OBSTRUCCIÓN DE LA VÍA AÉREA"]},{"t":"p","x":["La intervenció depèn de si l’obstrucció és lleu o greu.","La intervención depende de si la obstrucción es leve o grave."]},{"t":"p","x":["Obstrucció lleu: si la persona pot parlar, tossir i respirar, cal animar-la a continuar tossint i observar-ne l’evolució. No s’han de fer maniobres innecessàries mentre la tos sigui efectiva.","Obstrucción leve: si la persona puede hablar, toser y respirar, hay que animarla a continuar tosiendo y observar su evolución. No se deben hacer maniobras innecesarias mientras la tos sea efectiva."]},{"t":"p","x":["Obstrucció greu: si la persona no pot parlar, tossir eficaçment ni respirar, cal activar l’ajuda d’emergència i aplicar les maniobres de desobstrucció adequades a l’edat i a la situació, d’acord amb la formació rebuda i les instruccions del","Obstrucción grave: si la persona no puede hablar, toser eficazmente ni respirar, hay que activar la ayuda de emergencia y aplicar las maniobras de desobstrucción adecuadas a la edad y a la situación, de acuerdo con la formación recibida y las instrucciones del"]},{"t":"list","k":"ol","l":0,"items":[["En adults conscients, les recomanacions habituals inclouen alternar cinc cops interescapulars amb cinc compressions abdominals, sempre que siguin adequades per a aquella persona.","En adultos conscientes, las recomendaciones habituales incluyen alternar cinco golpes interescapulares con cinco compresiones abdominales, siempre que sean adecuadas para esa persona."]],"start":112},{"t":"p","x":["Si la víctima perd el coneixement, cal iniciar el procediment de reanimació indicat pels serveis d’emergència.","Si la víctima pierde el conocimiento, hay que iniciar el procedimiento de reanimación indicado por los servicios de emergencia."]},{"t":"sub","x":["3.4. HEMORRÀGIES EXTERNES","3.4. HEMORRAGIAS EXTERNAS"]},{"t":"p","x":["La prioritat és controlar la pèrdua de sang i demanar ajuda si l’hemorràgia és important.","La prioridad es controlar la pérdida de sangre y pedir ayuda si la hemorragia es importante."]},{"t":"viz","v":{"type":"steps","title":["Hemorràgia externa","Hemorragia externa"],"items":[{"x":["Protegir-se del contacte directe amb la sang utilitzant guants si estan disponibles.","Protegerse del contacto directo con la sangre utilizando guantes si están disponibles."],"i":"gloves","s":"must"},{"x":["Aplicar pressió directa i ferma sobre la ferida amb gases o un material adequat.","Aplicar presión directa y firme sobre la herida con gasas o un material adecuado."],"i":"hand","s":"safe"},{"x":["Si la sang travessa el primer apòsit, mantenir la pressió i afegir-hi material, sense retirar repetidament el que ja s’ha col·locat.","Si la sangre atraviesa el primer apósito, mantener la presión y añadir material, sin retirar repetidamente el que ya se ha colocado."],"i":"bandage","s":"safe"},{"x":["Activar el 112 davant d’una hemorràgia abundant, persistent o potencialment mortal.","Activar el 112 ante una hemorragia abundante, persistente o potencialmente mortal."],"i":"phone","s":"safe"},{"x":["Utilitzar un torniquet comercial només en les situacions indicades i si es disposa de formació o instruccions adequades.","Utilizar un torniquete comercial solo en las situaciones indicadas y si se dispone de formación o instrucciones adecuadas."],"i":"alert","s":"warn"}]}},{"t":"p","x":["No s’han d’extreure objectes clavats a la ferida ni manipular lesions profundes.","No se deben extraer objetos clavados en la herida ni manipular lesiones profundas."]},{"t":"sub","x":["3.5. CREMADES TÈRMIQUES I QUÍMIQUES","3.5. QUEMADURAS TÉRMICAS Y QUÍMICAS"]},{"t":"p","x":["En una cremada tèrmica, cal allunyar la persona de la font de calor quan sigui segur i refredar la zona amb aigua corrent fresca, sense provocar hipotèrmia ni aplicar gel directament. Després, es pot cobrir amb un apòsit net que no s’adhereixi a la lesió.","En una quemadura térmica, hay que alejar a la persona de la fuente de calor cuando sea seguro y enfriar la zona con agua corriente fresca, sin provocar hipotermia ni aplicar hielo directamente. Después, se puede cubrir con un apósito limpio que no se adhiera a la lesión."]},{"t":"p","x":["No s’han d’aplicar olis, mantega, cremes no indicades ni altres remeis casolans. Tampoc no s’han de rebentar les butllofes.","No se deben aplicar aceites, mantequilla, cremas no indicadas ni otros remedios caseros. Tampoco se deben reventar las ampollas."]},{"t":"p","x":["Davant d’una cremada química, la primera actuació depèn del producte implicat. Cal protegir-se, consultar les instruccions de seguretat del producte i activar l’assistència urgent quan correspongui. En general, s’ha de retirar la roba contaminada si es pot fer sense risc i irrigar abundantment la zona amb aigua, llevat que les instruccions específiques del producte indiquin un procediment diferent. Si el producte afecta els ulls, cal utilitzar immediatament el sistema de rentatge adequat i demanar assistència sanitària.","Ante una quemadura química, la primera actuación depende del producto implicado. Hay que protegerse, consultar las instrucciones de seguridad del producto y activar la asistencia urgente cuando corresponda. En general, se debe retirar la ropa contaminada si se puede hacer sin riesgo e irrigar abundantemente la zona con agua, salvo que las instrucciones específicas del producto indiquen un procedimiento diferente. Si el producto afecta a los ojos, hay que utilizar inmediatamente el sistema de lavado adecuado y pedir asistencia sanitaria."]},{"t":"sub","x":["3.6. TRAUMATISMES I POSSIBLES FRACTURES","3.6. TRAUMATISMOS Y POSIBLES FRACTURAS"]},{"t":"p","x":["Davant d’una caiguda, un cop fort o una possible fractura:","Ante una caída, un golpe fuerte o una posible fractura:"]},{"t":"list","k":"ul","l":1,"items":[["Evitar moviments innecessaris de la persona.","Evitar movimientos innecesarios de la persona."],["No intentar recol·locar ossos ni redreçar deformitats.","No intentar recolocar huesos ni enderezar deformidades."],["Protegir la zona afectada i mantenir-la tan estable com sigui possible, sense forçar-ne la posició.","Proteger la zona afectada y mantenerla tan estable como sea posible, sin forzar su posición."],["Controlar les hemorràgies visibles sense pressionar directament sobre objectes clavats o lesions greus.","Controlar las hemorragias visibles sin presionar directamente sobre objetos clavados o lesiones graves."],["Demanar assistència sanitària, especialment davant de dolor intens, deformitat, pèrdua de sensibilitat, traumatisme cranial o sospita de lesió vertebral.","Pedir asistencia sanitaria, especialmente ante dolor intenso, deformidad, pérdida de sensibilidad, traumatismo craneal o sospecha de lesión vertebral."]],"start":1},{"t":"p","x":["No s’ha de traslladar la víctima llevat que hi hagi un perill immediat o que sigui necessari per mantenir la via aèria o aplicar les mesures vitals.","No se debe trasladar a la víctima salvo que haya un peligro inmediato o que sea necesario para mantener la vía aérea o aplicar las medidas vitales."]},{"t":"sub","x":["3.7. CRISI CONVULSIVA","3.7. CRISIS CONVULSIVA"]},{"t":"p","x":["Durant una crisi convulsiva:","Durante una crisis convulsiva:"]},{"t":"list","k":"ul","l":1,"items":[["Apartar els objectes que puguin provocar lesions.","Apartar los objetos que puedan provocar lesiones."],["Protegir el cap amb un element tou si és possible.","Proteger la cabeza con un elemento blando si es posible."],["No subjectar la persona per la força.","No sujetar a la persona por la fuerza."],["No introduir cap objecte ni els dits a la boca.","No introducir ningún objeto ni los dedos en la boca."],["Controlar la durada de la crisi i observar-ne l’evolució.","Controlar la duración de la crisis y observar su evolución."],["Quan cessin les convulsions, comprovar la respiració i seguir les indicacions del 112; si respira amb normalitat, es pot valorar la PLS quan sigui adequada.","Cuando cesen las convulsiones, comprobar la respiración y seguir las indicaciones del 112; si respira con normalidad, se puede valorar la PLS cuando sea adecuada."]],"start":1},{"t":"p","x":["Cal demanar ajuda urgent si és la primera crisi coneguda, dura més del que és habitual o aproximadament cinc minuts, es repeteix sense recuperació, hi ha lesions greus, dificultat respiratòria o altres signes preocupants.","Hay que pedir ayuda urgente si es la primera crisis conocida, dura más de lo habitual o aproximadamente cinco minutos, se repite sin recuperación, hay lesiones graves, dificultad respiratoria u otros signos preocupantes."]}],"acts":[],"videos":[],"visuals":[{"type":"key","i":"heart","s":"safe","big":["30 : 2 · 100–120 / min","30 : 2 · 100–120 / min"],"x":["En adults, la seqüència habitual de RCP per a persones formades és de 30 compressions toràciques i 2 ventilacions, amb una freqüència de 100–120 compressions per minut. Si no es poden fer ventilacions, cal seguir les indicacions de l’operador i les recomanacions de primers auxilis aplicables.","En adultos, la secuencia habitual de RCP para personas formadas es de 30 compresiones torácicas y 2 ventilaciones, con una frecuencia de 100–120 compresiones por minuto. Si no se pueden hacer ventilaciones, hay que seguir las indicaciones del operador y las recomendaciones de primeros auxilios aplicables."]}]},{"num":4,"kind":"theory","title":["Analogia per recordar les tècniques","Analogía para recordar las técnicas"],"nodes":[{"t":"p","x":["La RCP és com una bomba manual provisional.","La RCP es como una bomba manual provisional."]},{"t":"p","x":["Quan el cor deixa de bombar sang de manera efectiva, les compressions toràciques poden ajudar a mantenir una circulació mínima mentre arriba l’ajuda professional.","Cuando el corazón deja de bombear sangre de manera efectiva, las compresiones torácicas pueden ayudar a mantener una circulación mínima mientras llega la ayuda profesional."]},{"t":"p","x":["La PLS és com mantenir lliure un conducte.","La PLS es como mantener libre un conducto."]},{"t":"p","x":["Col·locar adequadament una persona inconscient que respira pot ajudar a mantenir la via aèria lliure. No obstant això, sempre s’ha de vigilar la respiració i tenir en compte les possibles lesions traumàtiques.","Colocar adecuadamente a una persona inconsciente que respira puede ayudar a mantener la vía aérea libre. No obstante, siempre se debe vigilar la respiración y tener en cuenta las posibles lesiones traumáticas."]}],"acts":[],"videos":[],"visuals":[{"type":"compare","vs":true,"cols":[{"i":"heart","s":"safe","x":["La RCP és com una bomba manual provisional.","La RCP es como una bomba manual provisional."],"items":[["Quan el cor deixa de bombar sang de manera efectiva, les compressions toràciques poden ajudar a mantenir una circulació mínima mentre arriba l’ajuda professional.","Cuando el corazón deja de bombear sangre de manera efectiva, las compresiones torácicas pueden ayudar a mantener una circulación mínima mientras llega la ayuda profesional."]]},{"i":"lungs","s":"safe","x":["La PLS és com mantenir lliure un conducte.","La PLS es como mantener libre un conducto."],"items":[["Col·locar adequadament una persona inconscient que respira pot ajudar a mantenir la via aèria lliure. No obstant això, sempre s’ha de vigilar la respiració i tenir en compte les possibles lesions traumàtiques.","Colocar adecuadamente a una persona inconsciente que respira puede ayudar a mantener la vía aérea libre. No obstante, siempre se debe vigilar la respiración y tener en cuenta las posibles lesiones traumáticas."]]}]}],"fold":true},{"num":5,"kind":"example","title":["Exemples professionals del sector nàutic","Ejemplos profesionales del sector náutico"],"nodes":[{"t":"sub","x":["CAS 1. POSSIBLE ATURADA CARDIORESPIRATÒRIA AL PANTALÀ","CASO 1. POSIBLE PARADA CARDIORRESPIRATORIA EN EL PANTALÁN"]},{"t":"p","x":["Un tècnic pateix una descàrrega elèctrica i queda inconscient.","Un técnico sufre una descarga eléctrica y queda inconsciente."]},{"t":"p","x":["Cal eliminar el perill elèctric sense exposar-se, activar el 112 i valorar la respiració. Si no respira amb normalitat, s’ha d’iniciar la RCP i utilitzar un DEA tan aviat com sigui possible, seguint les indicacions de l’operador.","Hay que eliminar el peligro eléctrico sin exponerse, activar el 112 y valorar la respiración. Si no respira con normalidad, se debe iniciar la RCP y utilizar un DEA tan pronto como sea posible, siguiendo las indicaciones del operador."]},{"t":"sub","x":["CAS 2. EXPOSICIÓ A VAPORS EN UNA CABINA DE PINTURA","CASO 2. EXPOSICIÓN A VAPORES EN UNA CABINA DE PINTURA"]},{"t":"p","x":["Un treballador perd el coneixement després d’una possible inhalació de dissolvents.","Un trabajador pierde el conocimiento después de una posible inhalación de disolventes."]},{"t":"p","x":["No s’ha d’entrar a la zona contaminada sense protecció adequada. Cal activar el rescat especialitzat i el 112. Quan la víctima estigui en una zona segura, s’ha de valorar la consciència i la respiració i actuar segons les indicacions rebudes.","No se debe entrar en la zona contaminada sin protección adecuada. Hay que activar el rescate especializado y el 112. Cuando la víctima esté en una zona segura, se debe valorar la consciencia y la respiración y actuar según las indicaciones recibidas."]},{"t":"sub","x":["CAS 3. ESQUITXADA D’ÀCID DE BATERIA","CASO 3. SALPICADURA DE ÁCIDO DE BATERÍA"]},{"t":"p","x":["Durant el manteniment d’una bateria marina, un producte corrosiu esquitxa la pell o els ulls d’un treballador.","Durante el mantenimiento de una batería marina, un producto corrosivo salpica la piel o los ojos de un trabajador."]},{"t":"p","x":["Cal evitar el contacte amb el producte, utilitzar la dutxa o el rentaülls d’emergència quan correspongui i seguir les instruccions de seguretat del producte. S’ha d’activar l’assistència sanitària i no aplicar neutralitzants ni pomades improvisades.","Hay que evitar el contacto con el producto, utilizar la ducha o el lavaojos de emergencia cuando corresponda y seguir las instrucciones de seguridad del producto. Se debe activar la asistencia sanitaria y no aplicar neutralizantes ni pomadas improvisadas."]},{"t":"sub","x":["CAS 4. TALL PROFUND AMB UNA EINA DE MECANITZAT","CASO 4. CORTE PROFUNDO CON UNA HERRAMIENTA DE MECANIZADO"]},{"t":"p","x":["Un treballador pateix una ferida amb una hemorràgia abundant.","Un trabajador sufre una herida con una hemorragia abundante."]},{"t":"p","x":["Després d’assegurar la zona, cal protegir-se del contacte amb la sang, aplicar pressió directa i demanar ajuda urgent. Si l’hemorràgia és potencialment mortal, s’han de seguir les indicacions d’emergència i utilitzar els dispositius específics només segons el procediment i la formació corresponents.","Después de asegurar la zona, hay que protegerse del contacto con la sangre, aplicar presión directa y pedir ayuda urgente. Si la hemorragia es potencialmente mortal, se deben seguir las indicaciones de emergencia y utilizar los dispositivos específicos solo según el procedimiento y la formación correspondientes."]}],"acts":[],"videos":[]},{"num":6,"kind":"theory","title":["Normativa i fonts de referència","Normativa y fuentes de referencia"],"nodes":[{"t":"list","k":"ul","l":1,"items":[["Llei 31/1995, de prevenció de riscos laborals, article 20: organització de les mesures d’emergència i dels primers auxilis.","Ley 31/1995, de prevención de riesgos laborales, artículo 20: organización de las medidas de emergencia y de los primeros auxilios."],["Reial decret 486/1997, de 14 d’abril, annex VI: material i locals de primers auxilis als llocs de treball.","Real Decreto 486/1997, de 14 de abril, anexo VI: material y locales de primeros auxilios en los lugares de trabajo."],["Recomanacions de l’European Resuscitation Council (ERC) i d’ILCOR: referència tècnica per a les actuacions de reanimació i primers auxilis.","Recomendaciones del European Resuscitation Council (ERC) y de ILCOR: referencia técnica para las actuaciones de reanimación y primeros auxilios."]],"start":1},{"t":"p","x":["Les tècniques pràctiques s’han d’ensenyar d’acord amb les recomanacions vigents i la formació impartida per personal qualificat. La normativa laboral general no substitueix els protocols clínics actualitzats.","Las técnicas prácticas se deben enseñar de acuerdo con las recomendaciones vigentes y la formación impartida por personal cualificado. La normativa laboral general no sustituye a los protocolos clínicos actualizados."]}],"acts":[],"videos":[]},{"num":7,"kind":"activity","title":["Activitats d’aprenentatge","Actividades de aprendizaje"],"nodes":[{"t":"p","x":["ACTIVITAT 1. TALLER DE SIMULACIÓ DE PRIMERS AUXILIS","ACTIVIDAD 1. TALLER DE SIMULACIÓN DE PRIMEROS AUXILIOS"]},{"t":"p","x":["Amb supervisió docent i, quan correspongui, maniquins i equips de simulació, practiqueu:","Con supervisión docente y, cuando corresponda, maniquíes y equipos de simulación, practicad:"]},{"t":"list","k":"ul","l":1,"items":[["Seqüència d’actuació davant d’una possible aturada cardiorespiratòria.","Secuencia de actuación ante una posible parada cardiorrespiratoria."],["Ús simulat del DEA.","Uso simulado del DEA."],["Col·locació en PLS.","Colocación en PLS."],["Resolució de casos d’obstrucció de la via aèria.","Resolución de casos de obstrucción de la vía aérea."],["Control simulat d’hemorràgies i protecció de lesions.","Control simulado de hemorragias y protección de lesiones."]],"start":1},{"t":"p","x":["L’avaluació ha de centrar-se en la seguretat, l’ordre de les actuacions, l’activació dels serveis d’emergència i l’execució de les maniobres segons el protocol ensenyat.","La evaluación debe centrarse en la seguridad, el orden de las actuaciones, la activación de los servicios de emergencia y la ejecución de las maniobras según el protocolo enseñado."]},{"t":"p","x":["ACTIVITAT 2. RESOLUCIÓ DE CASOS PRÀCTICS","ACTIVIDAD 2. RESOLUC   function reportOverlay() {
    var d = collect();
    var title = t("rTitle") + " — " + (S.student.name || "") + " — " + t("day") + " " + C.day;
    var extra = [
      h("button", { type: "button", class: "btn", onclick: printReport }, t("print")),
      h("button", { type: "button", class: "btn ghost", onclick: copyReport }, t("copy"))];
    return overlayShell("report", title, reportHTML(d), extra);
  }
  function validReport() {
    if (!S.student.name.trim() || !S.student.group.trim()) {
      toast(t("needId")); go(C.blocks[0].id);
      var el = document.getElementById(!S.student.name.trim() ? "st-name" : "st-group"); if (el) el.focus();
      return false;
    }
    if (collect().doneN === 0 && !window.confirm(t("emptyWarn"))) return false;
    return true;
  }
  function generateReport() { if (validReport()) openOv("report"); }
  function printReport() {
    var fo = document.getElementById("finalobs"), pv = document.getElementById("finalobs-print");
    if (fo && pv) { pv.textContent = fo.value || "—"; pv.style.display = ""; fo.parentNode.querySelector("textarea").style.display = "none"; }
    document.body.classList.add("print-report");
    var old = document.title; document.title = "Informe_PRL_Dia" + C.day + "_" + slug(S.student.name);
    window.print();
    setTimeout(function () {
      document.title = old; document.body.classList.remove("print-report");
      if (fo && pv) { pv.style.display = "none"; fo.style.display = ""; }
    }, 600);
  }
  function copyReport() {
    var txt = reportPlain(collect());
    var fb = document.getElementById("copyfallback");
    function fallback() { fb.style.display = "block"; fb.value = txt; fb.focus(); fb.select(); toast(t("copyFail")); }
    if (navigator.clipboard && window.isSecureContext !== false) {
      navigator.clipboard.writeText(txt).then(function () { toast(t("copied")); }, function () {
        fb.value = txt; fb.style.display = "block"; fb.select();
        try { if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e) { }
        fallback();
      });
    } else {
      fb.value = txt; fb.style.display = "block"; fb.select();
      try { if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e) { }
      fallback();
    }
  }
  window.addEventListener("afterprint", function () { document.body.classList.remove("print-report"); });

  // API mínima per a proves automàtiques
  window.PRL = { state: function () { return S; }, report: function () { return reportPlain(collect()); }, go: go, setLang: setLang };
  render();
})();

</script>
