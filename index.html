egada presa la decisió.","La consulta consiste en informar a la plantilla una vez tomada la decisión."],"ans":false,"exp":["Ha de permetre considerar les observacions abans d'adoptar la decisió.","Debe permitir considerar las observaciones antes de adoptar la decisión."]},{"q":["Cal formar quan s'introdueixen equips o tecnologies nous.","Hay que formar cuando se introducen equipos o tecnologías nuevos."],"ans":true},{"q":["La direcció pot decidir unilateralment qui són els delegats de prevenció.","La dirección puede decidir unilateralmente quiénes son los delegados de prevención."],"ans":false}],"block":"B26","origin":"complementaria","ra":"RA2","ce":"vinculació provisional (el manual remet a la taula mestra; la planificació indica g i c per a B26)"}],"notes":[["Nota de correspondència: en la planificació del curs B26 figura com «Pla de prevenció, avaluació de riscos i planificació preventiva»; el manual hi desenvolupa la formació, informació, consulta i participació. La web segueix el manual.","Nota de correspondencia: en la planificación del curso B26 figura como «Plan de prevención, evaluación de riesgos y planificación preventiva»; el manual desarrolla la formación, información, consulta y participación. La web sigue el manual."]],"cover":{"signs":[["info","megaphone",["Informació","Información"]],["must","learn",["Formació","Formación"]],["safe","chat",["Consulta i participació","Consulta y participación"]]],"lead":["Conèixer una instrucció no significa necessàriament saber aplicar-la. Per això, en PRL, la informació i la formació s’han de complementar.","Conocer una instrucción no significa necesariamente saber aplicarla. Por eso, en PRL, la información y la formación se deben complementar."]}},{"id":"B27","ud":"UD4","title":["VIGILÀNCIA DE LA SALUT I REGISTRE","VIGILANCIA DE LA SALUD Y REGISTRO"],"meta":{"ra_fp":"RA2","ce_txt":"vinculació provisional (el manual remet a la matriu definitiva; la planificació indica e i h per a B27)","ra_cert":"Pendent (el manual remet a la gestió de la prevenció i vigilància de la salut)","pes":"Pendent (la planificació indica 2,50 % per a B27)"},"sections":[{"num":0,"kind":"intro","title":null,"nodes":[],"acts":[],"videos":[]},{"num":1,"kind":"objectives","title":["Què aprendrem?","¿Qué aprenderemos?"],"nodes":[{"t":"p","x":["En aquest bloc aprendràs com s’organitza la vigilància de la salut de les persones treballadores, quins drets la regulen i quines garanties protegeixen la intimitat i la confidencialitat de la informació mèdica.","En este bloque aprenderás cómo se organiza la vigilancia de la salud de las personas trabajadoras, qué derechos la regulan y qué garantías protegen la intimidad y la confidencialidad de la información médica."]},{"t":"p","x":["Aplicarem aquests conceptes a les activitats de manteniment d’embarcacions de recreo, en què l’exposició al soroll, a productes químics, a pols de fibra de vidre i a postures forçades pot provocar alteracions de la salut.","Aplicaremos estos conceptos a las actividades de mantenimiento de embarcaciones de recreo, en las que la exposición al ruido, a productos químicos, a polvo de fibra de vidrio y a posturas forzadas puede provocar alteraciones de la salud."]},{"t":"p","x":["Objectius d’aprenentatge","Objetivos de aprendizaje"]},{"t":"list","k":"ul","l":1,"items":[["Definir la vigilància de la salut i explicar-ne la finalitat preventiva.","Definir la vigilancia de la salud y explicar su finalidad preventiva."],["Identificar les característiques bàsiques de la vigilància de la salut.","Identificar las características básicas de la vigilancia de la salud."],["Diferenciar la regla general de voluntarietat dels supòsits legals d’obligatorietat.","Diferenciar la regla general de voluntariedad de los supuestos legales de obligatoriedad."],["Explicar les garanties de confidencialitat i protecció de les dades mèdiques.","Explicar las garantías de confidencialidad y protección de los datos médicos."],["Diferenciar els resultats mèdics dels informes d’aptitud laboral.","Diferenciar los resultados médicos de los informes de aptitud laboral."],["Identificar les principals actuacions de vigilància de la salut segons els riscos del lloc de treball.","Identificar las principales actuaciones de vigilancia de la salud según los riesgos del puesto de trabajo."],["Aplicar aquests conceptes a casos professionals del sector nàutic.","Aplicar estos conceptos a casos profesionales del sector náutico."]],"start":1,"smart":"goals"}],"acts":[],"videos":[]},{"num":2,"kind":"theory","title":["Conceptes essencials","Conceptos esenciales"],"nodes":[{"t":"table","rows":[[["Concepte","Concepto"],["Definició","Definición"]],[["Vigilància de la salut","Vigilancia de la salud"],["Activitat sanitària preventiva orientada a detectar possibles alteracions de la salut relacionades amb les condicions de treball.","Actividad sanitaria preventiva orientada a detectar posibles alteraciones de la salud relacionadas con las condiciones de trabajo."]],[["Reconeixement mèdic laboral","Reconocimiento médico laboral"],["Actuació sanitària que forma part de la vigilància de la salut i s’adapta als riscos del lloc de treball.","Actuación sanitaria que forma parte de la vigilancia de la salud y se adapta a los riesgos del puesto de trabajo."]],[["Voluntarietat","Voluntariedad"],["Principi general segons el qual la vigilància de la salut requereix el consentiment de la persona treballadora, amb les excepcions legals.","Principio general según el cual la vigilancia de la salud requiere el consentimiento de la persona trabajadora, con las excepciones legales."]],[["Confidencialitat mèdica","Confidencialidad médica"],["Protecció de les dades de salut, que només poden ser accessibles a les persones autoritzades legalment.","Protección de los datos de salud, que solo pueden ser accesibles a las personas autorizadas legalmente."]],[["Aptitud laboral","Aptitud laboral"],["Conclusió preventiva sobre la capacitat de la persona per desenvolupar les funcions del lloc, tenint en compte les condicions aplicables.","Conclusión preventiva sobre la capacidad de la persona para desarrollar las funciones del puesto, teniendo en cuenta las condiciones aplicables."]],[["Vigilància específica","Vigilancia específica"],["Vigilància adaptada als riscos professionals als quals està exposada la persona treballadora.","Vigilancia adaptada a los riesgos profesionales a los que está expuesta la persona trabajadora."]],[["Vigilància postocupacional","Vigilancia postocupacional"],["Seguiment de la salut després de finalitzar l’exposició laboral, quan la normativa o les característiques del risc ho requereixen.","Seguimiento de la salud después de finalizar la exposición laboral, cuando la normativa o las características del riesgo lo requieren."]],[["Historial mèdic laboral","Historial médico laboral"],["Documentació sanitària generada en el marc de la vigilància de la salut, subjecta a les garanties de confidencialitat i custòdia corresponents.","Documentación sanitaria generada en el marco de la vigilancia de la salud, sujeta a las garantías de confidencialidad y custodia correspondientes."]]]},{"t":"sub","x":["3. Explicació dels conceptes","3. Explicación de los conceptos"]},{"t":"sub","x":["3.1. QUÈ ÉS LA VIGILÀNCIA DE LA SALUT?","3.1. ¿QUÉ ES LA VIGILANCIA DE LA SALUD?"]},{"t":"p","x":["La vigilància de la salut és una activitat preventiva que permet identificar possibles efectes de les condicions de treball sobre la salut de les persones.","La vigilancia de la salud es una actividad preventiva que permite identificar posibles efectos de las condiciones de trabajo sobre la salud de las personas."]},{"t":"p","x":["No consisteix simplement a fer una revisió mèdica general. Ha d’estar vinculada als riscos identificats en l’avaluació de riscos i als protocols sanitaris que corresponguin.","No consiste simplemente en hacer una revisión médica general. Debe estar vinculada a los riesgos identificados en la evaluación de riesgos y a los protocolos sanitarios que correspondan."]},{"t":"p","x":["En un taller nàutic, per exemple, pot ser necessari prestar una atenció específica a:","En un taller náutico, por ejemplo, puede ser necesario prestar una atención específica a:"]},{"t":"viz","v":{"type":"cards","items":[{"i":"noise","s":"warn","x":["L’exposició al soroll generat per compressors, polidores i altres equips.","La exposición al ruido generado por compresores, pulidoras y otros equipos."]},{"i":"dust","s":"warn","x":["La inhalació de pols durant el poliment de materials compostos.","La inhalación de polvo durante el pulido de materiales compuestos."]},{"i":"flask","s":"warn","x":["El contacte amb resines, dissolvents, pintures i altres agents químics.","El contacto con resinas, disolventes, pinturas y otros agentes químicos."]},{"i":"lift","s":"warn","x":["La manipulació manual de càrregues.","La manipulación manual de cargas."]},{"i":"back","s":"warn","x":["Les postures forçades en treballs dins de sentines o espais de difícil accés.","Las posturas forzadas en trabajos dentro de sentinas o espacios de difícil acceso."]}]}},{"t":"p","x":["La vigilància de la salut contribueix a detectar precoçment possibles alteracions i aporta informació preventiva que pot ajudar a revisar les mesures de protecció.","La vigilancia de la salud contribuye a detectar precozmente posibles alteraciones y aporta información preventiva que puede ayudar a revisar las medidas de protección."]},{"t":"sub","x":["3.2. CARACTERÍSTIQUES DE LA VIGILÀNCIA DE LA SALUT","3.2. CARACTERÍSTICAS DE LA VIGILANCIA DE LA SALUD"]},{"t":"p","x":["La vigilància de la salut ha de respectar les característiques següents:","La vigilancia de la salud debe respetar las características siguientes:"]},{"t":"list","k":"ul","l":1,"items":[["Garantida per l’empresa: l’empresa ha d’organitzar-la en els termes previstos legalment.","Garantizada por la empresa: la empresa debe organizarla en los términos previstos legalmente."],["Específica: s’ha d’adaptar als riscos del lloc de treball.","Específica: se debe adaptar a los riesgos del puesto de trabajo."],["Gratuïta: el cost no ha de recaure sobre la persona treballadora.","Gratuita: el coste no debe recaer sobre la persona trabajadora."],["Respectuosa amb la intimitat: les actuacions sanitàries han de preservar la dignitat i la confidencialitat.","Respetuosa con la intimidad: las actuaciones sanitarias deben preservar la dignidad y la confidencialidad."],["No discriminatòria: els resultats no poden utilitzar-se amb finalitats discriminatòries ni en perjudici de la persona.","No discriminatoria: los resultados no pueden utilizarse con finalidades discriminatorias ni en perjuicio de la persona."],["Voluntària com a regla general: llevat dels supòsits en què la normativa permet o exigeix excepcions.","Voluntaria como regla general: salvo en los supuestos en los que la normativa permite o exige excepciones."]],"start":1},{"t":"sub","x":["3.3. VOLUNTARIETAT I EXCEPCIONS","3.3. VOLUNTARIEDAD Y EXCEPCIONES"]},{"t":"p","x":["L’article 22 de la Llei de prevenció de riscos laborals estableix que la vigilància de la salut requereix, com a regla general, el consentiment de la persona treballadora.","El artículo 22 de la Ley de prevención de riesgos laborales establece que la vigilancia de la salud requiere, como regla general, el consentimiento de la persona trabajadora."]},{"t":"p","x":["La llei preveu excepcions quan la vigilància sigui imprescindible per:","La ley prevé excepciones cuando la vigilancia sea imprescindible para:"]},{"t":"list","k":"ol","l":0,"items":[["Avaluar els efectes de les condicions de treball sobre la salut.","Evaluar los efectos de las condiciones de trabajo sobre la salud."],["Comprovar si l’estat de salut pot constituir un perill per a la mateixa persona, per a altres persones treballadores","Comprobar si el estado de salud puede constituir un peligro para la misma persona, para otras personas trabajadoras"]],"start":1},{"t":"list","k":"ol","l":1,"items":[["per a tercers.","o para terceros."]],"start":1},{"t":"list","k":"ol","l":0,"items":[["Complir una disposició legal relacionada amb riscos específics o activitats d’especial perillositat.","Cumplir una disposición legal relacionada con riesgos específicos o actividades de especial peligrosidad."]],"start":3},{"t":"p","x":["Aquestes excepcions s’han d’interpretar de manera restrictiva i respectar les garanties legals, inclosa la consulta prèvia als representants de les persones treballadores quan correspongui.","Estas excepciones se deben interpretar de manera restrictiva y respetar las garantías legales, incluida la consulta previa a los representantes de las personas trabajadoras cuando corresponda."]},{"t":"box","k":"important","label":null,"nodes":[{"t":"p","x":["Important: l’existència d’un risc químic, físic o ergonòmic no converteix automàticament qualsevol reconeixement mèdic en obligatori. Cal comprovar si es compleixen els requisits legals del supòsit concret.","Importante: la existencia de un riesgo químico, físico o ergonómico no convierte automáticamente cualquier reconocimiento médico en obligatorio. Hay que comprobar si se cumplen los requisitos legales del supuesto concreto."]}]},{"t":"sub","x":["3.4. CONFIDENCIALITAT I APTITUD LABORAL","3.4. CONFIDENCIALIDAD Y APTITUD LABORAL"]},{"t":"p","x":["La informació mèdica personal està protegida. L’empresari i les persones responsables de la gestió preventiva no poden accedir lliurement als diagnòstics, a les proves clíniques ni a la història mèdica de la plantilla.","La información médica personal está protegida. El empresario y las personas responsables de la gestión preventiva no pueden acceder libremente a los diagnósticos, a las pruebas clínicas ni a la historia médica de la plantilla."]},{"t":"p","x":["L’empresa ha de rebre les conclusions preventives que siguin pertinents, com ara la necessitat d’introduir o millorar mesures de protecció o les conclusions sobre l’aptitud per al lloc de treball.","La empresa debe recibir las conclusiones preventivas que sean pertinentes, como la necesidad de introducir o mejorar medidas de protección o las conclusiones sobre la aptitud para el puesto de trabajo."]},{"t":"p","x":["Per exemple, si un tècnic presenta una limitació que impedeix realitzar una determinada tasca amb seguretat, l’empresa pot necessitar conèixer les restriccions laborals aplicables per adaptar el lloc. No necessita conèixer el diagnòstic clínic que les ha originat.","Por ejemplo, si un técnico presenta una limitación que impide realizar una determinada tarea con seguridad, la empresa puede necesitar conocer las restricciones laborales aplicables para adaptar el puesto. No necesita conocer el diagnóstico clínico que las ha originado."]},{"t":"p","x":["Aquesta separació protegeix la intimitat i permet prendre decisions preventives adequades.","Esta separación protege la intimidad y permite tomar decisiones preventivas adecuadas."]},{"t":"sub","x":["3.5. VIGILÀNCIA DE LA SALUT SEGONS ELS RISCOS DEL SECTOR","3.5. VIGILANCIA DE LA SALUD SEGÚN LOS RIESGOS DEL SECTOR"]},{"t":"p","x":["Els protocols i les actuacions sanitàries s’han d’adaptar als riscos efectivament presents.","Los protocolos y las actuaciones sanitarias se deben adaptar a los riesgos efectivamente presentes."]},{"t":"table","rows":[[["Risc professional","Riesgo profesional"],["Possible actuació de vigilància","Posible actuación de vigilancia"]],[["Soroll de compressors i polidores","Ruido de compresores y pulidoras"],["Vigilància auditiva segons l’exposició i el protocol aplicable.","Vigilancia auditiva según la exposición y el protocolo aplicable."]],[["Pols de fibra de vidre","Polvo de fibra de vidrio"],["Valoració sanitària en funció de l’exposició i dels riscos respiratoris.","Valoración sanitaria en función de la exposición y de los riesgos respiratorios."]],[["Resines, pintures i dissolvents","Resinas, pinturas y disolventes"],["Vigilància específica segons els agents químics i les vies d’exposició.","Vigilancia específica según los agentes químicos y las vías de exposición."]],[["Manipulació manual de càrregues","Manipulación manual de cargas"],["Valoració dels possibles efectes sobre l’aparell musculoesquelètic, segons els riscos identificats.","Valoración de los posibles efectos sobre el aparato musculoesquelético, según los riesgos identificados."]],[["Exposició a agents amb efectes a llarg termini","Exposición a agentes con efectos a largo plazo"],["Seguiment i conservació de la documentació d’acord amb la normativa específica aplicable.","Seguimiento y conservación de la documentación de acuerdo con la normativa específica aplicable."]]]},{"t":"p","x":["No totes les persones treballadores necessiten les mateixes proves ni la mateixa periodicitat. Aquestes decisions corresponen al personal sanitari competent, d’acord amb els riscos i els protocols aplicables.","No todas las personas trabajadoras necesitan las mismas pruebas ni la misma periodicidad. Estas decisiones corresponden al personal sanitario competente, de acuerdo con los riesgos y los protocolos aplicables."]},{"t":"sub","x":["3.6. QUAN ES POT EFECTUAR LA VIGILÀNCIA?","3.6. ¿CUÁNDO SE PUEDE EFECTUAR LA VIGILANCIA?"]},{"t":"p","x":["La vigilància de la salut pot incloure actuacions en diferents moments de la vida laboral, segons els riscos i les necessitats preventives:","La vigilancia de la salud puede incluir actuaciones en diferentes momentos de la vida laboral, según los riesgos y las necesidades preventivas:"]},{"t":"list","k":"ul","l":1,"items":[["En incorporar-se a l’empresa o quan s’assignen tasques amb riscos nous, en els supòsits aplicables.","Al incorporarse a la empresa o cuando se asignan tareas con riesgos nuevos, en los supuestos aplicables."],["De manera periòdica, quan correspongui segons els protocols sanitaris.","De manera periódica, cuando corresponda según los protocolos sanitarios."],["Després d’una absència prolongada per motius de salut, quan sigui necessari valorar els possibles efectes sobre la salut relacionats amb el treball.","Después de una ausencia prolongada por motivos de salud, cuando sea necesario valorar los posibles efectos sobre la salud relacionados con el trabajo."],["Després de finalitzar l’exposició o la relació laboral, quan la normativa prevegi vigilància postocupacional.","Después de finalizar la exposición o la relación laboral, cuando la normativa prevea vigilancia postocupacional."]],"start":1},{"t":"p","x":["La periodicitat i les proves no s’han d’establir de manera arbitrària ni aplicar-se igual a tots els llocs de treball.","La periodicidad y las pruebas no se deben establecer de manera arbitraria ni aplicarse igual a todos los puestos de trabajo."]},{"t":"sub","x":["3.7. CUSTÒDIA DELS REGISTRES SANITARIS","3.7. CUSTODIA DE LOS REGISTROS SANITARIOS"]},{"t":"p","x":["Els historials i registres mèdics s’han de custodiar amb les garanties de confidencialitat corresponents. Els terminis de conservació depenen de la normativa aplicable a cada risc i tipus de documentació.","Los historiales y registros médicos se deben custodiar con las garantías de confidencialidad correspondientes. Los plazos de conservación dependen de la normativa aplicable a cada riesgo y tipo de documentación."]},{"t":"p","x":["En conseqüència, no és correcte aplicar un termini general únic a tots els historials mèdics. En determinades exposicions, com les relacionades amb l’amiant o amb agents cancerígens, poden existir obligacions específiques de conservació prolongada.","En consecuencia, no es correcto aplicar un plazo general único a todos los historiales médicos. En determinadas exposiciones, como las relacionadas con el amianto o con agentes cancerígenos, pueden existir obligaciones específicas de conservación prolongada."]},{"t":"p","x":["La gestió documental ha de garantir que la informació sigui accessible només a les persones autoritzades i que es compleixin els terminis legals de conservació.","La gestión documental debe garantizar que la información sea accesible solo a las personas autorizadas y que se cumplan los plazos legales de conservación."]}],"acts":[],"videos":[],"visuals":[{"type":"compare","title":["Voluntarietat i excepcions (art. 22 LPRL)","Voluntariedad y excepciones (art. 22 LPRL)"],"vs":true,"pos":"after","cols":[{"i":"check","s":"safe","x":["Regla general","Regla general"],"items":[["Cal el consentiment de la persona treballadora","Se necesita el consentimiento de la persona trabajadora"]]},{"i":"alert","s":"warn","x":["Excepcions","Excepciones"],"items":[["Avaluar els efectes de les condicions de treball sobre la salut.","Evaluar los efectos de las condiciones de trabajo sobre la salud."],["Comprovar si l’estat de salut pot constituir un perill per a la mateixa persona, per a altres persones treballadores","Comprobar si el estado de salud puede constituir un peligro para la misma persona, para otras personas trabajadoras"],["Complir una disposició legal relacionada amb riscos específics o activitats d’especial perillositat.","Cumplir una disposición legal relacionada con riesgos específicos o actividades de especial peligrosidad."]]}]},{"type":"compare","title":["Què rep l'empresa i què no","Qué recibe la empresa y qué no"],"vs":true,"pos":"after","cols":[{"i":"check","s":"safe","x":["Sí: conclusions preventives","Sí: conclusiones preventivas"],"items":[["L’empresa ha de rebre les conclusions preventives que siguin pertinents, com ara la necessitat d’introduir o millorar mesures de protecció o les conclusions sobre l’aptitud per al lloc de treball.","La empresa debe recibir las conclusiones preventivas que sean pertinentes, como la necesidad de introducir o mejorar medidas de protección o las conclusiones sobre la aptitud para el puesto de trabajo."]]},{"i":"lock","s":"ban","x":["No: diagnòstics ni història mèdica","No: diagnósticos ni historia médica"],"items":[["La informació mèdica personal està protegida. L’empresari i les persones responsables de la gestió preventiva no poden accedir lliurement als diagnòstics, a les proves clíniques ni a la història mèdica de la plantilla.","La información médica personal está protegida. El empresario y las personas responsables de la gestión preventiva no pueden acceder libremente a los diagnósticos, a las pruebas clínicas ni a la historia médica de la plantilla."]]}]}]},{"num":4,"kind":"theory","title":["Analogia: el panell de control d’una embarcació","Analogía: el panel de control de una embarcación"],"nodes":[{"t":"p","x":["La vigilància de la salut és semblant al panell de control d’una embarcació.","La vigilancia de la salud es parecida al panel de control de una embarcación."]},{"t":"p","x":["Els indicadors permeten detectar una anomalia abans que es produeixi una avaria greu. De manera similar, la vigilància de la salut pot identificar senyals d’alteració relacionats amb el treball.","Los indicadores permiten detectar una anomalía antes de que se produzca una avería grave. De manera similar, la vigilancia de la salud puede identificar señales de alteración relacionadas con el trabajo."]},{"t":"p","x":["Tanmateix, detectar una anomalia no elimina per si mateix la causa. Si es detecta un possible efecte del soroll, per exemple, cal revisar també les mesures de control de l’exposició.","Sin embargo, detectar una anomalía no elimina por sí mismo la causa. Si se detecta un posible efecto del ruido, por ejemplo, hay que revisar también las medidas de control de la exposición."]},{"t":"p","x":["La vigilància de la salut complementa la prevenció; no substitueix l’obligació d’eliminar o reduir els riscos.","La vigilancia de la salud complementa la prevención; no sustituye a la obligación de eliminar o reducir los riesgos."]}],"acts":[],"videos":[],"visuals":[{"type":"key","i":"gear","s":"info","big":["Panell de control","Panel de control"],"x":["Els indicadors permeten detectar una anomalia abans que es produeixi una avaria greu. De manera similar, la vigilància de la salut pot identificar senyals d’alteració relacionats amb el treball.","Los indicadores permiten detectar una anomalía antes de que se produzca una avería grave. De manera similar, la vigilancia de la salud puede identificar señales de alteración relacionadas con el trabajo."],"src":["La vigilància de la salut complementa la prevenció; no substitueix l’obligació d’eliminar o reduir els riscos.","La vigilancia de la salud complementa la prevención; no sustituye a la obligación de eliminar o reducir los riesgos."]}]},{"num":5,"kind":"example","title":["Exemples professionals del sector nàutic","Ejemplos profesionales del sector náutico"],"nodes":[{"t":"sub","x":["EXEMPLE 1. MECÀNIC EXPOSAT AL SOROLL","EJEMPLO 1. MECÁNICO EXPUESTO AL RUIDO"]},{"t":"p","x":["Un mecànic treballa habitualment amb compressors i eines sorolloses. L’avaluació de riscos identifica una exposició que requereix mesures específiques.","Un mecánico trabaja habitualmente con compresores y herramientas ruidosas. La evaluación de riesgos identifica una exposición que requiere medidas específicas."]},{"t":"p","x":["L’empresa ha d’aplicar les mesures preventives corresponents i organitzar la vigilància de la salut segons els requisits legals i el protocol aplicable. Les conclusions sanitàries poden contribuir a revisar les mesures de protecció.","La empresa debe aplicar las medidas preventivas correspondientes y organizar la vigilancia de la salud según los requisitos legales y el protocolo aplicable. Las conclusiones sanitarias pueden contribuir a revisar las medidas de protección."]},{"t":"sub","x":["EXEMPLE 2. TÈCNIC QUE TREBALLA AMB RESINES","EJEMPLO 2. TÉCNICO QUE TRABAJA CON RESINAS"]},{"t":"p","x":["Una persona treballadora manipula resines i dissolvents durant operacions de reparació.","Una persona trabajadora manipula resinas y disolventes durante operaciones de reparación."]},{"t":"p","x":["Cal valorar els agents químics, les vies d’exposició i les mesures preventives. La vigilància de la salut s’ha d’adaptar als riscos identificats i a les disposicions aplicables, sense pressuposar que qualsevol reconeixement és obligatori.","Hay que valorar los agentes químicos, las vías de exposición y las medidas preventivas. La vigilancia de la salud se debe adaptar a los riesgos identificados y a las disposiciones aplicables, sin presuponer que cualquier reconocimiento es obligatorio."]},{"t":"sub","x":["EXEMPLE 3. PETICIÓ D’UN DIAGNÒSTIC PER PART DE L’ENCARREGAT","EJEMPLO 3. PETICIÓN DE UN DIAGNÓSTICO POR PARTE DEL ENCARGADO"]},{"t":"p","x":["Un encarregat demana a l’empresa que li faciliti el diagnòstic mèdic d’un treballador que ha sol·licitat una adaptació del lloc.","Un encargado pide a la empresa que le facilite el diagnóstico médico de un trabajador que ha solicitado una adaptación del puesto."]},{"t":"p","x":["La petició no està justificada pel simple fet d’exercir funcions de supervisió. S’han de respectar les garanties de confidencialitat i facilitar únicament la informació preventiva que sigui legalment pertinent.","La petición no está justificada por el simple hecho de ejercer funciones de supervisión. Se deben respetar las garantías de confidencialidad y facilitar únicamente la información preventiva que sea legalmente pertinente."]},{"t":"sub","x":["EXEMPLE 4. EXPOSICIÓ PASSADA A UN AGENT PERILLÓS","EJEMPLO 4. EXPOSICIÓN PASADA A UN AGENTE PELIGROSO"]},{"t":"p","x":["Un tècnic ha finalitzat una feina en què estava exposat a un agent amb efectes potencialment tardans.","Un técnico ha finalizado un trabajo en el que estaba expuesto a un agente con efectos potencialmente tardíos."]},{"t":"p","x":["Cal comprovar si la normativa específica estableix vigilància postocupacional i obligacions de conservació documental. La finalització del contracte no elimina necessàriament aquestes obligacions.","Hay que comprobar si la normativa específica establece vigilancia postocupacional y obligaciones de conservación documental. La finalización del contrato no elimina ne ,"doc",["Registre i custòdia","Registro y custodia"]]],"lead":["La vigilància de la salut complementa la prevenció; no substitueix l’obligació d’eliminar o reduir els riscos.","La vigilancia de la salud complementa la prevención; no sustituye a la obligación de eliminar o reducir los riesgos."]}},{"id":"B28","ud":"UD4","title":["PLA D’EMERGÈNCIA I AUTOPROTECCIÓ","PLAN DE EMERGENCIA Y AUTOPROTECCIÓN"],"meta":{"ra_fp":"RA2","ce_txt":"vinculació provisional (el manual remet a la matriu RA–CE; la planificació indica d i g per a B28)","ra_cert":"Pendent (el manual remet a l'actuació davant emergències)","pes":"Pendent (la planificació indica 1,25 % per a B28)"},"sections":[{"num":0,"kind":"intro","title":null,"nodes":[],"acts":[],"videos":[]},{"num":1,"kind":"objectives","title":["Què aprendrem?","¿Qué aprenderemos?"],"nodes":[{"t":"p","x":["En aquest bloc aprendràs a identificar les mesures que ha d’organitzar una empresa per respondre davant d’una emergència, comprendre el funcionament del pla d’emergència i diferenciar-lo del Pla d’Autoprotecció.","En este bloque aprenderás a identificar las medidas que debe organizar una empresa para responder ante una emergencia, comprender el funcionamiento del plan de emergencia y diferenciarlo del Plan de Autoprotección."]},{"t":"p","x":["Aplicarem els conceptes a un taller o varador de manteniment d’embarcacions, on es poden produir incendis, vessaments de productes químics, accidents durant maniobres de varada i emergències mèdiques.","Aplicaremos los conceptos a un taller o varadero de mantenimiento de embarcaciones, donde se pueden producir incendios, derrames de productos químicos, accidentes durante maniobras de varada y emergencias médicas."]},{"t":"p","x":["Objectius d’aprenentatge","Objetivos de aprendizaje"]},{"t":"list","k":"ul","l":1,"items":[["Explicar les obligacions empresarials en matèria d’emergències.","Explicar las obligaciones empresariales en materia de emergencias."],["Diferenciar les mesures d’emergència, el pla d’emergència i el Pla d’Autoprotecció.","Diferenciar las medidas de emergencia, el plan de emergencia y el Plan de Autoprotección."],["Identificar els principals nivells d’emergència utilitzats en els plans d’actuació.","Identificar los principales niveles de emergencia utilizados en los planes de actuación."],["Reconèixer les funcions dels equips d’emergència.","Reconocer las funciones de los equipos de emergencia."],["Descriure la seqüència d’alarma, intervenció i evacuació.","Describir la secuencia de alarma, intervención y evacuación."],["Identificar les condicions de seguretat de les vies d’evacuació i dels punts de trobada.","Identificar las condiciones de seguridad de las vías de evacuación y de los puntos de encuentro."],["Valorar la funció dels simulacres i proposar millores a partir dels resultats.","Valorar la función de los simulacros y proponer mejoras a partir de los resultados."]],"start":1,"smart":"goals"}],"acts":[],"videos":[]},{"num":2,"kind":"theory","title":["Conceptes essencials","Conceptos esenciales"],"nodes":[{"t":"table","rows":[[["Concepte","Concepto"],["Definició","Definición"]],[["Mesures d’emergència","Medidas de emergencia"],["Accions organitzatives i materials destinades a respondre davant de situacions d’emergència, incloent-hi els primers auxilis, la lluita contra incendis i l’evacuació.","Acciones organizativas y materiales destinadas a responder ante situaciones de emergencia, incluidos los primeros auxilios, la lucha contra incendios y la evacuación."]],[["Pla d’emergència","Plan de emergencia"],["Document o conjunt d’instruccions que organitza la resposta davant de les emergències previsibles al centre de treball.","Documento o conjunto de instrucciones que organiza la respuesta ante las emergencias previsibles en el centro de trabajo."]],[["Pla d’Autoprotecció (PAU)","Plan de Autoprotección (PAU)"],["Instrument organitzatiu integral exigible a les activitats i instal·lacions incloses en l’àmbit d’aplicació de la normativa d’autoprotecció.","Instrumento organizativo integral exigible a las actividades e instalaciones incluidas en el ámbito de aplicación de la normativa de autoprotección."]],[["Conat d’emergència","Conato de emergencia"],["Incidència inicial que, segons el pla, pot ser controlada amb mitjans immediats i sense exposar ningú a un risc inacceptable.","Incidencia inicial que, según el plan, puede ser controlada con medios inmediatos y sin exponer a nadie a un riesgo inaceptable."]],[["Emergència parcial","Emergencia parcial"],["Situació que afecta una zona o sector i que requereix una resposta més àmplia que la prevista per a un conat.","Situación que afecta a una zona o sector y que requiere una respuesta más amplia que la prevista para un conato."]],[["Emergència general","Emergencia general"],["Situació que supera la capacitat d’intervenció prevista per al centre i pot requerir l’evacuació general i l’ajuda dels serveis externs.","Situación que supera la capacidad de intervención prevista para el centro y puede requerir la evacuación general y la ayuda de los servicios externos."]],[["Equip d’emergència","Equipo de emergencia"],["Personal designat i format per desenvolupar les funcions que li assigna el pla d’emergència.","Personal designado y formado para desarrollar las funciones que le asigna el plan de emergencia."]],[["Punt de trobada","Punto de encuentro"],["Zona segura i identificada on es dirigeixen les persones evacuades per facilitar el recompte i la coordinació.","Zona segura e identificada a la que se dirigen las personas evacuadas para facilitar el recuento y la coordinación."]],[["Simulacre","Simulacro"],["Exercici planificat que permet comprovar l’eficàcia dels procediments d’emergència i identificar aspectes de millora.","Ejercicio planificado que permite comprobar la eficacia de los procedimientos de emergencia e identificar aspectos de mejora."]]]},{"t":"sub","x":["3. Explicació dels conceptes","3. Explicación de los conceptos"]},{"t":"sub","x":["3.1. OBLIGACIONS DE L’EMPRESA DAVANT D’UNA EMERGÈNCIA","3.1. OBLIGACIONES DE LA EMPRESA ANTE UNA EMERGENCIA"]},{"t":"p","x":["L’article 20 de la Llei de prevenció de riscos laborals obliga l’empresa a analitzar les possibles situacions d’emergència i adoptar les mesures necessàries en matèria de:","El artículo 20 de la Ley de prevención de riesgos laborales obliga a la empresa a analizar las posibles situaciones de emergencia y adoptar las medidas necesarias en materia de:"]},{"t":"viz","v":{"type":"cards","items":[{"i":"kit","s":"safe","x":["Primers auxilis.","Primeros auxilios."]},{"i":"extinguisher","s":"fire","x":["Lluita contra incendis.","Lucha contra incendios."]},{"i":"exit","s":"safe","x":["Evacuació de les persones treballadores.","Evacuación de las personas trabajadoras."]},{"i":"user","s":"info","x":["Designació del personal encarregat de posar en pràctica les mesures.","Designación del personal encargado de poner en práctica las medidas."]},{"i":"learn","s":"info","x":["Formació adequada del personal designat.","Formación adecuada del personal designado."]},{"i":"check","s":"info","x":["Comprovació periòdica del funcionament correcte de les mesures adoptades.","Comprobación periódica del funcionamiento correcto de las medidas adoptadas."]}],"cols":4}},{"t":"p","x":["Les mesures han de ser adequades a la dimensió de l’empresa, a l’activitat i als riscos existents.","Las medidas deben ser adecuadas a la dimensión de la empresa, a la actividad y a los riesgos existentes."]},{"t":"p","x":["En un varador, per exemple, no n’hi ha prou amb disposar d’extintors. Cal establir com es comunica una emergència, qui activa l’alarma, quines zones s’han d’evacuar, com s’avisa el 112 i com es comprova que les persones han arribat a una zona segura.","En un varadero, por ejemplo, no basta con disponer de extintores. Hay que establecer cómo se comunica una emergencia, quién activa la alarma, qué zonas se deben evacuar, cómo se avisa al 112 y cómo se comprueba que las personas han llegado a una zona segura."]},{"t":"sub","x":["3.2. PLA D’EMERGÈNCIA I PLA D’AUTOPROTECCIÓ","3.2. PLAN DE EMERGENCIA Y PLAN DE AUTOPROTECCIÓN"]},{"t":"p","x":["Els dos instruments estan relacionats, però no són equivalents.","Los dos instrumentos están relacionados, pero no son equivalentes."]},{"t":"p","x":["Pla d’emergència","Plan de emergencia"]},{"t":"p","x":["Organitza la resposta davant de les situacions previsibles al centre de treball. Estableix les actuacions, les responsabilitats, els mitjans disponibles i els procediments d’evacuació i assistència.","Organiza la respuesta ante las situaciones previsibles en el centro de trabajo. Establece las actuaciones, las responsabilidades, los medios disponibles y los procedimientos de evacuación y asistencia."]},{"t":"p","x":["Pla d’Autoprotecció (PAU)","Plan de Autoprotección (PAU)"]},{"t":"p","x":["És un instrument més ampli que integra l’anàlisi de riscos, les mesures d’autoprotecció, els mitjans disponibles, el pla d’actuació davant d’emergències i els procediments d’integració amb els serveis públics.","Es un instrumento más amplio que integra el análisis de riesgos, las medidas de autoprotección, los medios disponibles, el plan de actuación ante emergencias y los procedimientos de integración con los servicios públicos."]},{"t":"p","x":["El PAU s’exigeix a les activitats, establiments i instal·lacions que entren dins de l’àmbit d’aplicació de la normativa corresponent. Per tant, no es pot afirmar que qualsevol taller nàutic hi estigui obligat sense comprovar les característiques de l’activitat i els requisits legals aplicables.","El PAU se exige a las actividades, establecimientos e instalaciones que entran dentro del ámbito de aplicación de la normativa correspondiente. Por tanto, no se puede afirmar que cualquier taller náutico esté obligado a él sin comprobar las características de la actividad y los requisitos legales aplicables."]},{"t":"sub","x":["3.3. NIVELLS D’EMERGÈNCIA","3.3. NIVELES DE EMERGENCIA"]},{"t":"p","x":["Molts plans d’emergència utilitzen una classificació gradual per organitzar la resposta.","Muchos planes de emergencia utilizan una clasificación gradual para organizar la respuesta."]},{"t":"viz","v":{"type":"bars","title":["Nivells d'emergència","Niveles de emergencia"],"items":[{"x":["Conat","Conato"],"v":1,"l":["Avís i actuació inicial segons el procediment establert.","Aviso y actuación inicial según el procedimiento establecido."],"s":"warn"},{"x":["Emergència parcial","Emergencia parcial"],"v":2,"l":["Activació dels equips previstos i evacuació de la zona afectada, si correspon.","Activación de los equipos previstos y evacuación de la zona afectada, si corresponde."],"s":"fire"},{"x":["Emergència general","Emergencia general"],"v":3,"l":["Alarma general, evacuació segons el pla i intervenció dels serveis externs.","Alarma general, evacuación según el plan e intervención de los servicios externos."],"s":"fire"}]}},{"t":"p","x":["Aquesta classificació és una eina organitzativa. La terminologia exacta, els criteris d’activació i les responsabilitats han de quedar definits en el pla aplicable a cada centre.","Esta clasificación es una herramienta organizativa. La terminología exacta, los criterios de activación y las responsabilidades deben quedar definidos en el plan aplicable a cada centro."]},{"t":"p","x":["Prioritat absoluta: ningú no ha d’intentar controlar un incendi, una fuita o una altra incidència si la intervenció el posa en perill. Cal donar l’alarma, seguir el pla i evacuar quan correspongui.","Prioridad absoluta: nadie debe intentar controlar un incendio, una fuga u otra incidencia si la intervención lo pone en peligro. Hay que dar la alarma, seguir el plan y evacuar cuando corresponda."]},{"t":"sub","x":["3.4. EQUIPS D’EMERGÈNCIA I FUNCIONS","3.4. EQUIPOS DE EMERGENCIA Y FUNCIONES"]},{"t":"p","x":["Les funcions concretes depenen del pla de cada centre. Una organització possible inclou:","Las funciones concretas dependen del plan de cada centro. Una organización posible incluye:"]},{"t":"viz","v":{"type":"cards","items":[{"i":"boss","s":"safe","x":["Cap d’emergència","Jefe de emergencia"],"d":["Coordina la resposta, activa les actuacions previstes i gestiona la comunicació amb els serveis externs segons el pla.","Coordina la respuesta, activa las actuaciones previstas y gestiona la comunicación con los servicios externos según el plan."]},{"i":"user","s":"safe","x":["Cap d’intervenció","Jefe de intervención"],"d":["Coordina les actuacions dels equips d’intervenció en el lloc de l’incident, quan aquesta funció existeix.","Coordina las actuaciones de los equipos de intervención en el lugar del incidente, cuando esta función existe."]},{"i":"extinguisher","s":"fire","x":["Equip de primera intervenció","Equipo de primera intervención"],"d":["Actua davant d’incidències inicials amb els mitjans disponibles, només quan disposa de formació i les condicions són segures.","Actúa ante incidencias iniciales con los medios disponibles, solo cuando dispone de formación y las condiciones son seguras."]},{"i":"hose","s":"fire","x":["Equip de segona intervenció","Equipo de segunda intervención"],"d":["Intervé en situacions que requereixen recursos o formació especialitzats, d’acord amb el pla.","Interviene en situaciones que requieren recursos o formación especializados, de acuerdo con el plan."]},{"i":"exit","s":"safe","x":["Equip d’alarma i evacuació","Equipo de alarma y evacuación"],"d":["Facilita l’evacuació ordenada, orienta les persones i contribueix al recompte al punt de trobada.","Facilita la evacuación ordenada, orienta a las personas y contribuye al recuento en el punto de encuentro."]},{"i":"kit","s":"safe","x":["Equip de primers auxilis","Equipo de primeros auxilios"],"d":["Presta l’assistència inicial dins dels seus coneixements i de la formació rebuda fins a l’arribada dels serveis sanitaris.","Presta la asistencia inicial dentro de sus conocimientos y de la formación recibida hasta la llegada de los servicios sanitarios."]}],"cols":2}},{"t":"p","x":["Les sigles i la composició dels equips poden variar entre centres. Les funcions han de quedar clarament definides i les persones designades han de rebre la formació adequada.","Las siglas y la composición de los equipos pueden variar entre centros. Las funciones deben quedar claramente definidas y las personas designadas deben recibir la formación adecuada."]},{"t":"sub","x":["3.5. SEQÜÈNCIA D’ACTUACIÓ DAVANT D’UNA EMERGÈNCIA","3.5. SECUENCIA DE ACTUACIÓN ANTE UNA EMERGENCIA"]},{"t":"p","x":["La seqüència general es pot resumir així:","La secuencia general se puede resumir así:"]},{"t":"viz","v":{"type":"steps","title":["Seqüència d'actuació davant d'una emergència","Secuencia de actuación ante una emergencia"],"items":[{"x":["Detectar: identificar l’incident sense exposar-se a un perill.","Detectar: identificar el incidente sin exponerse a un peligro."],"i":"search","s":"warn"},{"x":["Avisar: activar el sistema d’alarma i comunicar la situació segons el procediment.","Avisar: activar el sistema de alarma y comunicar la situación según el procedimiento."],"i":"bell","s":"fire"},{"x":["Valorar i coordinar: el personal responsable determina les actuacions previstes, sense retardar l’evacuació quan sigui necessària.","Valorar y coordinar: el personal responsable determina las actuaciones previstas, sin retrasar la evacuación cuando sea necesaria."],"i":"boss","s":"info"},{"x":["Intervenir o evacuar: només s’intervé si la persona està formada, disposa dels mitjans necessaris i l’actuació és segura. En cas contrari, s’evacua.","Intervenir o evacuar: solo se interviene si la persona está formada, dispone de los medios necesarios y la actuación es segura. En caso contrario, se evacua."],"i":"exit","s":"safe"},{"x":["Avisar els serveis externs: trucar al 112 quan correspongui i facilitar informació clara sobre la ubicació, el tipus d’incident i els possibles riscos.","Avisar a los servicios externos: llamar al 112 cuando corresponda y facilitar información clara sobre la ubicación, el tipo de incidente y los posibles riesgos."],"i":"phone","s":"safe"},{"x":["Arribar al punt de trobada: seguir les rutes establertes i facilitar el recompte de les persones evacuades.","Llegar al punto de encuentro: seguir las rutas establecidas y facilitar el recuento de las personas evacuadas."],"i":"group","s":"safe"},{"x":["Revisar l’actuació: quan l’emergència hagi finalitzat, analitzar les incidències i aplicar les millores necessàries.","Revisar la actuación: cuando la emergencia haya finalizado, analizar las incidencias y aplicar las mejoras necesarias."],"i":"cycle","s":"info"}]}},{"t":"p","x":["No s’han de tornar a ocupar les instal·lacions fins que les persones responsables o els serveis competents ho autoritzin.","No se deben volver a ocupar las instalaciones hasta que las personas responsables o los servicios competentes lo autoricen."]},{"t":"sub","x":["3.6. VIES D’EVACUACIÓ I PUNT DE TROBADA","3.6. VÍAS DE EVACUACIÓN Y PUNTO DE ENCUENTRO"]},{"t":"p","x":["Les vies d’evacuació han d’estar senyalitzades, ser practicables i mantenir-se lliures d’obstacles. Les sortides, els recorreguts i l’enllumenat d’emergència han de complir els requisits que siguin aplicables al centre.","Las vías de evacuación deben estar señalizadas, ser practicables y mantenerse libres de obstáculos. Las salidas, los recorridos y el alumbrado de emergencia deben cumplir los requisitos que sean aplicables al centro."]},{"t":"p","x":["En un taller nàutic, bidons de resina, palets, eines o peces d’embarcacions no han d’obstruir les sortides ni els recorreguts d’evacuació.","En un taller náutico, bidones de resina, palés, herramientas o piezas de embarcaciones no deben obstruir las salidas ni los recorridos de evacuación."]},{"t":"p","x":["El punt de trobada ha de ser una zona segura, coneguda per la plantilla i situada fora de l’àrea de perill. Ha de permetre comprovar qui ha evacuat i comunicar als responsables qualsevol persona que pugui continuar a l’interior.","El punto de encuentro debe ser una zona segura, conocida por la plantilla y situada fuera del área de peligro. Debe permitir comprobar quién ha evacuado y comunicar a los responsables cualquier persona que pueda continuar en el interior."]},{"t":"sub","x":["3.7. SIMULACRES I REVISIÓ DEL PLA","3.7. SIMULACROS Y REVISIÓN DEL PLAN"]},{"t":"p","x":["Un simulacre permet comprovar si les persones coneixen l’alarma, les rutes d’evacuació i el punt de trobada, i si els procediments funcionen com estava previst.","Un simulacro permite comprobar si las personas conocen la alarma, las rutas de evacuación y el punto de encuentro, y si los procedimientos funcionan como estaba previsto."]},{"t":"p","x":["Durant l’exercici es poden observar:","Durante el ejercicio se pueden observar:"]},{"t":"list","k":"ul","l":1,"items":[["El temps necessari per iniciar l’evacuació.","El tiempo necesario para iniciar la evacuación."],["La comprensió dels senyals d’alarma.","La comprensión de las señales de alarma."],["L’estat i l’accessibilitat de les sortides.","El estado y la accesibilidad de las salidas."],["Les dificultats de mobilitat o de comunicació.","Las dificultades de movilidad o de comunicación."],["El funcionament del recompte al punt de trobada.","El funcionamiento del recuento en el punto de encuentro."],["La coordinació entre els responsables i els equips designats.","La coordinación entre los responsables y los equipos designados."]],"start":1},{"t":"p","x":["La periodicitat dels simulacres s’ha d’establir d’acord amb la normativa aplicable i el pla del centre. Quan sigui exigible un PAU, s’han de complir els requisits específics que corresponguin.","La periodicidad de los simulacros se debe establecer de acuerdo con la normativa aplicable y el plan del centro. Cuando sea exigible un PAU, se deben cumplir los requisitos específicos que correspondan."]},{"t":"p","x":["Un simulacre no és una competició per evacuar en el menor temps possible. L’objectiu és comprovar la seguretat i l’eficàcia del procediment, detectar mancances i corregir-les.","Un simulacro no es una competición para evacuar en el menor tiempo posible. El objetivo es comprobar la seguridad y la eficacia del procedimiento, detectar carencias y corregirlas."]}],"acts":[],"videos":[{"title":["Napo in… fire alert! — episodi 04: Organised chaos","Napo in… fire alert! — episodio 04: Organised chaos"],"source":["EU-OSHA — canal oficial «Napo» (YouTube); pel·lícula sense diàlegs","EU-OSHA — canal oficial «Napo» (YouTube); película sin diálogos"],"duration":"1:17","url":"https://www.youtube.com/watch?v=pq2C_00JmHc","verified":true,"use":["Evacuació desordenada: útil per comentar el paper de l'equip d'alarma i evacuació i del punt de trobada.","Evacuación desordenada: útil para comentar el papel del equipo de alarma y evacuación y del punto de encuentro."],"question":["Quines millores proposaries al simulacre que mostra l'escena?","¿Qué mejoras propondrías al simulacro que muestra la escena?"]}],"visuals":[{"type":"compare","title":["Pla d'emergència i PAU","Plan de emergencia y PAU"],"vs":true,"cols":[{"i":"doc","s":"safe","x":["Pla d’emergència","Plan de emergencia"],"items":[["Organitza la resposta davant de les situacions previsibles al centre de treball. Estableix les actuacions, les responsabilitats, els mitjans disponibles i els procediments d’evacuació i assistència.","Organiza la respuesta ante las situaciones previsibles en el centro de trabajo. Establece las actuaciones, las responsabilidades, los medios disponibles y los procedimientos de evacuación y asistencia."]]},{"i":"book","s":"info","x":["Pla d’Autoprotecció (PAU)","Plan de Autoprotección (PAU)"],"items":[["És un instrument més ampli que integra l’anàlisi de riscos, les mesures d’autoprotecció, els mitjans disponibles, el pla d’actuació davant d’emergències i els procediments d’integració amb els serveis públics.","Es un instrumento más amplio que integra el análisis de riesgos, las medidas de autoprotección, los medios disponibles, el plan de actuación ante emergencias y los procedimientos de integración con los servicios públicos."]]}]},{"type":"key","i":"hand","s":"ban","x":["Prioritat absoluta: ningú no ha d’intentar controlar un incendi, una fuita o una altra incidència si la intervenció el posa en perill. Cal donar l’alarma, seguir el pla i evacuar quan correspongui.","Prioridad absoluta: nadie debe intentar controlar un incendio, una fuga u otra incidencia si la intervención lo pone en peligro. Hay que dar la alarma, seguir el plan y evacuar cuando corresponda."]}]},{"num":4,"kind":"theory","title":["Analogia: el capità i la tripulació","Analogía: el capitán y la tripulación"],"nodes":[{"t":"p","x":["En una embarcació, una emergència requereix coordinació: una persona ha de dirigir la resposta, els membres de la tripulació han de conèixer les seves funcions i tothom ha de seguir els procediments establerts.","En una embarcación, una emergencia requiere coordinación: una persona debe dirigir la respuesta, los miembros de la tripulación deben conocer sus funciones y todo el mundo debe seguir los procedimientos establecidos."]},{"t":"p","x":["En un centre de treball passa el mateix. La coordinació evita ordres contradictòries i ajuda a garantir que les persones actuïn de manera ordenada.","En un centro de trabajo pasa lo mismo. La coordinación evita órdenes contradictorias y ayuda a garantizar que las personas actúen de manera ordenada."]},{"t":"p","x":["Tanmateix, la coordinació no significa que tothom hagi d’intervenir directament. De vegades, la decisió més segura és avisar, evacuar i deixar la intervenció especialitzada als serveis competents.","Sin embargo, la coordinación no significa que todo el mundo deba intervenir directamente. A veces, la decisión más segura es avisar, evacuar y dejar la intervención especializada a los servicios competentes."]}],"acts":[],"videos":[],"visuals":[{"type":"compare","vs":["≈","≈"],"cols":[{"i":"boat","s":"info","x":["Capità i tripulació","Capitán y tripulación"],"items":[["En una embarcació, una emergència requereix coordinació: una persona ha de dirigir la resposta, els membres de la tripulació han de conèixer les seves funcions i tothom ha de seguir els procediments establerts.","En una embarcación, una emergencia requiere coordinación: una persona debe dirigir la respuesta, los miembros de la tripulación deben conocer sus funciones y todo el mundo debe seguir los procedimientos establecidos."]]},{"i":"building","s":"info","x":["Centre de treball","Centro de trabajo"],"items":[["En un centre de treball passa el mateix. La coordinació evita ordres contradictòries i ajuda a garantir que les persones actuïn de manera ordenada.","En un centro de trabajo pasa lo mismo. La coordinación evita órdenes contradictorias y ayuda a garantizar que las personas actúen de manera ordenada."]]}]}]},{"num":5,"kind":"example","title":["Exemples professionals del sector nàutic","Ejemplos profesionales del sector náutico"],"nodes":[{"t":"sub","x":["EXEMPLE 1. CONAT D’INCENDI A LA ZONA DE FUSTERIA","EJEMPLO 1. CONATO DE INCENDIO EN LA ZONA DE CARPINTERÍA"]},{"t":"p","x":["Una guspira provoca un petit foc en una zona de treball.","Una chispa provoca un pequeño fuego en una zona de trabajo."]},{"t":"p","x":["La persona que el detecta ha d’avisar segons el procediment establert. Només es pot intentar l’extinció inicial si la persona disposa de formació, l’equip és adequat i existeix una via d’escapament segura. Si el foc no es controla immediatament o hi ha dubtes, cal allunyar-se i activar la resposta prevista.","La persona que lo detecta debe avisar según el procedimiento establecido. Solo se puede intentar la extinción inicial si la persona dispone de formación, el equipo es adecuado y existe una vía de escape segura. Si el fuego no se controla inmediatamente o hay dudas, hay que alejarse y activar la respuesta prevista."]},{"t":"sub","x":["EXEMPLE 2. INCENDI A LA ZONA DE PINTURA","EJEMPLO 2. INCENDIO EN LA ZONA DE PINTURA"]},{"t":"p","x":["Es produeix un incendi en una zona on s’utilitzen productes inflamables.","Se produce un incendio en una zona donde se utilizan productos inflamables."]},{"t":"p","x":["La situació pot evolucionar ràpidament. Cal activar l’alarma, evacuar la zona segons el pla i avisar els serveis d’emergència quan correspongui. No s’ha d’entrar en una zona amb fum ni intentar intervenir sense els mitjans i la formació adequats.","La situación puede evolucionar rápidamente. Hay que activar la alarma, evacuar la zona según el plan y avisar a los servicios de emergencia cuando corresponda. No se debe entrar en una zona con humo ni intentar intervenir sin los medios y la formación adecuados."]},{"t":"sub","x":["EXEMPLE 3. INCENDI DURANT UNA MANIOBRA DE VARADA","EJEMPLO 3. INCENDIO DURANTE UNA MANIOBRA DE VARADA"]},{"t":"p","x":["Un incendi afecta una embarcació situada en una zona de maniobra amb equips d’elevació.","Un incendio afecta a una embarcación situada en una zona de maniobra con equipos de elevación."]},{"t":"p","x":["Cal considerar tant el foc com els riscos associats a la càrrega suspesa, al combustible i a les vies de circulació. S’han d’activar les mesures del pla, impedir l’accés a la zona de perill i coordinar la intervenció amb els serveis externs.","Hay que considerar tanto el fuego como los riesgos asociados a la carga suspendida, al combustible y a las vías de circulación. Se deben activar las medidas del plan, impedir el acceso a la zona de peligro y coordinar la intervención con los servicios externos."]},{"t":"sub","x":["EXEMPLE 4. SORTIDA D’EMERGÈNCIA BLOQUEJADA","EJEMPLO 4. SALIDA DE EMERGENCIA BLOQUEADA"]},{"t":"p","x":["Durant una inspecció es detecta que diversos bidons obstrueixen una sortida.","Durante una inspección se detecta que varios bidones obstruyen una salida."]},{"t":"p","x":["La situació s’ha de corregir immediatament i cal comprovar si hi ha altres obstacles. També s’ha d’investigar per què s’ha produït el bloqueig i adoptar mesures perquè no es repeteixi.","La situación se debe corregir inmediatamente y hay que comprobar si hay otros obstáculos. También se debe investigar por qué se ha producido el bloqueo y adoptar medidas para que no se repita."]}],"acts":[],"videos":[]},{"num":6,"kind":"theory","title":["Normativa aplicable","Normativa aplicable"],"nodes":[{"t":"list","k":"ul","l":1,"items":[["Llei 31/1995, de prevenció de riscos laborals:","Ley 31/1995, de prevención de riesgos laborales:"]],"start":1},{"t":"list","k":"ol","l":2,"items":[["Article 20: mesures d’emergència.","Artículo 20: medidas de emergencia."],["Article 14: dret a una protecció eficaç en matèria de seguretat i salut.","Artículo 14: derecho a una protección eficaz en materia de seguridad y salud."]],"start":1},{"t":"list","k":"ul","l":1,"items":[["Reial decret 486/1997, sobre disposicions mínimes de seguretat i salut als llocs de treball: requisits aplicables a les vies i sortides d’emergència, les condicions dels llocs de treball i els mitjans corresponents.","Real Decreto 486/1997, sobre disposiciones mínimas de seguridad y salud en los lugares de trabajo: requisitos aplicables a las vías y salidas de emergencia, las condiciones de los lugares de trabajo y los medios correspondientes."],["Reial decret 485/1997, sobre senyalització de seguretat i salut en el treball: senyalització dels recorreguts, sortides i mitjans de salvament que corresponguin.","Real Decreto 485/1997, sobre señalización de seguridad y salud en el trabajo: señalización de los recorridos, salidas y medios de salvamento que correspondan."],["Reial decret 513/2017, pel qual s’aprova el Reglament d’instal·lacions de protecció contra incendis: requisits aplicables a les instal·lacions de protecció contra incendis.","Real Decreto 513/2017, por el que se aprueba el Reglamento de instalaciones de protección contra incendios: requisitos aplicables a las instalaciones de protección contra incendios."],["Reial decret 393/2007, pel qual s’aprova la Norma bàsica d’autoprotecció: s’ha de comprovar l’àmbit d’aplicació i les disposicions vigents que corresponguin a l’activitat i la instal·lació.","Real Decreto 393/2007, por el que se aprueba la Norma Básica de Autoprotección: se debe comprobar el ámbito de aplicación y las disposiciones vigentes que correspondan a la actividad y la instalación."]],"start":1},{"t":"p","x":["Abans d’utilitzar aquest bloc com a material normatiu definitiu, cal verificar la vigència de les disposicions citades i els requisits autonòmics o sectorials aplicables a la instal·lació concreta.","Antes de utilizar este bloque como material normativo definitivo, hay que verificar la vigencia de las disposiciones citadas y los requisitos autonómicos o sectoriales aplicables a la instalación concreta."]}],"acts":[],"videos":[]},{"num":7,"kind":"activity","title":["Aplicació a l’empresa: activitats","Aplicación a la empresa: actividades"],"nodes":[{"t":"p","x":["ACTIVITAT 1. AUDITORIA DELS MITJANS D’EMERGÈNCIA","ACTIVIDAD 1. AUDITORÍA DE LOS MEDIOS DE EMERGENCIA"]},{"t":"p","x":["En petits grups, analitzeu un plànol del taller o del centre educatiu.","En pequeños grupos, analizad un plano del taller o del centro educativo."]},{"t":"p","x":["Identifiqueu-hi, quan existeixin:","Identificad, cuando existan:"]},{"t":"list","k":"ul","l":1,"items":[["Sortides i recorreguts d’evacuació.","Salidas y recorridos de evacuación."],["Extintors i altres mitjans de protecció contra incendis.","Extintores y otros medios de protección contra incendios."],["Polsadors o mitjans d’activació de l’alarma.","Pulsadores o medios de activación de la alarma."],["Enllumenat d’emergència.","Alumbrado de emergencia."],["Punt de trobada.","Punto de encuentro."],["Zones de risc especial.","Zonas de riesgo especial."]],"start":1},{"t":"p","x":["Comproveu si els recorreguts estan lliures d’obstacles i si la senyalització és visible. No manipuleu els equips de seguretat ni
